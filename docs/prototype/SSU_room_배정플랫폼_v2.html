<title>SSU:room 배정 플랫폼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 로그인 → 상단 바(사용자) → 단계 바(지난 단계 보기) → 역할별 메뉴 → 작업 영역 */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --sunk:#eef1f6; --line:#dce2ec; --ink:#17202e; --muted:#5a6577;
  --accent:#2a54b4; --accent-soft:#e5ecfb; --accent-ink:#ffffff;
  --good:#1d7f55; --good-soft:#e2f4ea; --warn:#a86a12; --warn-soft:#fbf0dc; --bad:#bd3a33; --bad-soft:#fbe6e4;
  --font:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#151c27; --sunk:#111821; --line:#263142; --ink:#e5eaf2; --muted:#97a2b3;
  --accent:#7d9fff; --accent-soft:#1b2846; --accent-ink:#0e131b;
  --good:#4cc38a; --good-soft:#12301f; --warn:#e2a84c; --warn-soft:#33270f; --bad:#f07a72; --bad-soft:#3a1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#151c27; --sunk:#111821; --line:#263142; --ink:#e5eaf2; --muted:#97a2b3;
  --accent:#7d9fff; --accent-soft:#1b2846; --accent-ink:#0e131b;
  --good:#4cc38a; --good-soft:#12301f; --warn:#e2a84c; --warn-soft:#33270f; --bad:#f07a72; --bad-soft:#3a1715; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}
.btn{white-space:nowrap;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 11px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)} .p-mute{background:var(--sunk);color:var(--muted)}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)} .mono{font-family:var(--mono);font-size:12.5px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.side{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
.cols.cfg{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-weight:600;font-size:13px}
input[type=text],input[type=password],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
select{width:auto}
.field select{width:100%}
textarea{min-height:80px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
/* login */
.login{display:flex;align-items:center;justify-content:center;padding-block:56px}
.login-box{width:100%;max-width:760px}
.login-head{margin-bottom:20px}
.login-head b{font-size:26px;letter-spacing:-.02em}
.login-head div{color:var(--muted)}
.login-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.login-card h2{margin:0;font-size:17px}
/* shell */
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand b{font-size:17px} .brand span{color:var(--muted);font-size:13px;margin-left:8px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13.5px}
.stagebar{background:var(--surface);border-bottom:1px solid var(--line)}
.stagebar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.stages{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.stg i{font-style:normal;font-family:var(--mono);font-size:11.5px}
button.stg{cursor:pointer}
.stg.done{color:var(--good);border-color:transparent;background:var(--good-soft)}
.stg.now{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.stg.viewing{outline:2px solid var(--warn);outline-offset:1px}
.stagebar .act{margin-left:auto}
.banner{background:var(--warn-soft);color:var(--ink);border-bottom:1px solid var(--line)}
.banner .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:9px;font-size:13.5px}
.confirm{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.confirm .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:10px;font-size:13.5px}
nav.menu{border-bottom:1px solid var(--line);background:var(--bg)}
nav.menu .wrap{display:flex;gap:4px;overflow-x:auto}
nav.menu button{border:0;background:none;color:var(--muted);padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.menu button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.menu .n{display:inline-block;margin-left:6px;font-size:11.5px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 6px}
main{padding-block:20px 48px}
.head{margin-bottom:16px}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
td{font-variant-numeric:tabular-nums}
.req-table{min-width:800px}
/* week timetable */
.week{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.week table{min-width:860px;table-layout:fixed}
.week th{background:var(--sunk);text-align:center;font-size:13px;color:var(--ink);font-weight:600}
.week th:first-child,.week td:first-child{width:96px;background:var(--sunk);text-align:left}
.week td{height:84px;padding:5px;border-left:1px solid var(--line)}
.week td.off{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px)}
.tlabel b{display:block;font-family:var(--mono);font-size:12.5px}
.tlabel span{font-size:11.5px;color:var(--muted)}
.chip{display:block;width:100%;text-align:left;border-radius:7px;padding:4px 7px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer;margin-bottom:3px}
.chip b{display:block;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.mine{background:var(--accent-soft);border-color:var(--accent)}
.chip.unmet{background:var(--warn-soft);border-color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad)}
.chip.sel{outline:2px solid var(--accent);outline-offset:1px}
.chip .f{font-size:10.5px;font-weight:600;color:var(--warn)}
.chip.bad .f{color:var(--bad)}
.chip .f.c{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.tog{display:flex;flex-wrap:wrap;gap:6px}
.tog button{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:5px 11px;cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tog button:disabled{cursor:default}
.ai{background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.ai .k{color:var(--muted);display:inline-block;min-width:62px;margin-right:6px}
.kv{display:grid;grid-template-columns:80px minmax(0,1fr);gap:4px 10px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile small{color:var(--muted);font-size:12.5px}
.tile .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v em{font-style:normal;font-size:13.5px;color:var(--muted);font-weight:500}
.cfgp label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-bottom:8px}
.cfgp label.ck input{margin-top:4px;accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:118px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.slider input{width:100%;accent-color:var(--accent)}
.cfgp h3{font-size:13px;margin:14px 0 8px;color:var(--muted);font-weight:600}
.quote{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13.5px;margin:6px 0}
.list{display:flex;flex-direction:column;gap:8px}
.item{text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;width:100%}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item b{display:block}
.aiact{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px;margin-top:12px}
.aiact .say{font-size:14px;margin:4px 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;margin-top:6px}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.warns{margin:8px 0 0;padding-left:18px;color:var(--bad);font-size:13px}
.mail{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.mail .mh{padding:12px 14px;border-bottom:1px solid var(--line)}
.mail .mb{padding:14px;white-space:pre-line;font-size:13.5px}
.empty{padding:26px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:900px){
  .cols,.cols.side,.cols.cfg,.login-grid{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards{grid-template-columns:minmax(0,1fr)}
  .who,.stagebar .act{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
:root{--y1b:#e6effd;--y1l:#6f97e0;--y2b:#e2f3e8;--y2l:#4f9f70;--y3b:#eee7fb;--y3l:#8c70cc;--y4b:#fcefe0;--y4l:#c98236;--blk:#e9ecf2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--y1b:#192842;--y1l:#5f86d6;--y2b:#14301f;--y2l:#4e9b6c;--y3b:#272040;--y3l:#8d72c8;--y4b:#382714;--y4l:#c98238;--blk:#1b2330}}
:root[data-theme="dark"]{--y1b:#192842;--y1l:#5f86d6;--y2b:#14301f;--y2l:#4e9b6c;--y3b:#272040;--y3l:#8d72c8;--y4b:#382714;--y4l:#c98238;--blk:#1b2330}
.login-grid.four{grid-template-columns:repeat(3,minmax(0,1fr))}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.tile:hover{border-color:var(--accent)}
button.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tile .more{display:block;font-size:11.5px;color:var(--accent);margin-top:2px}
.flow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:10px;align-items:stretch}
.fnode{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;justify-content:center;text-align:center;gap:4px}
.fnode b{font-size:15px} .fnode.me{border-color:var(--accent);background:var(--accent-soft)}
.flane{display:flex;flex-direction:column;justify-content:center;gap:6px}
.farr{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);font:inherit;font-size:12.5px;color:inherit;text-align:left;width:100%}
button.farr{cursor:pointer} button.farr:hover{border-color:var(--accent)}
.farr .ar{font-weight:700;color:var(--accent);flex:none} .farr.l .ar{color:var(--good)}
.farr .c{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.farr.zero{opacity:.55}
.prow{cursor:pointer} .prow:hover td{background:var(--sunk)} .prow[aria-expanded="true"] td{background:var(--accent-soft)}
.thread{display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.bub{max-width:78%;border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:13px;background:var(--surface)}
.bub.out{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.bub.in{align-self:flex-start;background:var(--good-soft);border-color:transparent}
.bub .h{display:flex;gap:8px;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.bub .h b{color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);position:relative}
.step small{color:var(--muted);font-size:12px;display:block} .step .v{font-size:19px;font-weight:700}
.step .note{margin:2px 0 0}
details.msg summary{cursor:pointer}
@media (max-width:900px){.flow{grid-template-columns:minmax(0,1fr)}.flane{padding:0 8px}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.bub{max-width:92%}}
.chip.y1{background:var(--y1b);border-color:var(--y1l)} .chip.y2{background:var(--y2b);border-color:var(--y2l)}
.chip.y3{background:var(--y3b);border-color:var(--y3l)} .chip.y4{background:var(--y4b);border-color:var(--y4l)}
.chip.tmp{border-style:dashed;border-width:2px}
.chip.bad{border-color:var(--bad);border-width:2px;border-style:solid}
.chip.mine{box-shadow:inset 0 0 0 2px var(--accent)}
.chip.gen{background:var(--blk);cursor:default}
.chip .f{display:block;font-size:10.5px;font-weight:600;color:var(--warn)}
.chip .f.ok{color:var(--good)} .chip .f.x{color:var(--bad)} .chip .f.m{color:var(--accent)}
.week td.blk{background:var(--blk)}
.week td.blk .bl{font-size:11px;color:var(--muted);font-weight:600}
.sw.y1{background:var(--y1b);border-color:var(--y1l)} .sw.y2{background:var(--y2b);border-color:var(--y2l)}
.sw.y3{background:var(--y3b);border-color:var(--y3l)} .sw.y4{background:var(--y4b);border-color:var(--y4l)}
.sw.dash{border:2px dashed var(--muted)} .sw.red{border:2px solid var(--bad)} .sw.me{box-shadow:inset 0 0 0 2px var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:12px}
.filters .field{min-width:130px}
.cf{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.cf + .cf{margin-top:10px}
.cf .kv{grid-template-columns:76px minmax(0,1fr);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.todo{display:flex;flex-direction:column;gap:8px}
.todo .t{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.rres{display:flex;flex-direction:column;gap:8px}
.rres .r{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.excsv{width:100%;min-height:140px;font-family:var(--mono);font-size:12px}
.reqcard .slots{display:flex;flex-wrap:wrap;gap:5px}
.reqcard .slots button{font-size:12.5px;padding:4px 8px}
.reqcard .slots button.blocked{text-decoration:line-through}
.hist{border:1px solid var(--warn);border-radius:12px;padding:14px;background:var(--warn-soft);margin-bottom:16px}
@media (max-width:900px){.login-grid.four{grid-template-columns:minmax(0,1fr)}}
</style>

  const freeRoom=suit.find(r=>!at.some(x=>x.r===r));
  if(pg.length){const x=pg[0],xc=COURSES[x.c];const why=xc.p===c.p?`같은 교수의 「${nm(x.c)}」과 시간이 겹침`:`같은 ${c.y}학년 전공 「${nm(x.c)}」(${pn(xc.p)})과 시간이 겹침`;return {st:'peer',want:best,with:pg.map(x=>x.c),why}}
  if(!freeRoom){const occ=at.filter(x=>suit.includes(x.r));const x=occ[0];return {st:'peer',want:best,with:occ.map(x=>x.c),why:`맞는 ${c.lab?'실습실':'강의실'}(${suit.map(r=>RM[r].no).join(', ')})을 「${nm(x.c)}」(${pn(COURSES[x.c].p)})이 사용`}}
  return {st:'soft',want:best,with:[],why:'건물·동선 조건과 함께 맞추느라 시간이 조정됨'};
}
const OPEN_ST=['peer','rule','soft'];
const openConflicts=()=>S.plan?Object.keys(COURSES).filter(id=>!S.done[id]&&OPEN_ST.includes(analyze(id).st)):[];
function altsFor(id,plan,n=3){
  plan=plan||S.plan;const cur=plan.find(e=>e.c===id),rest=plan.filter(e=>e.c!==id),o=[];
  for(const x of cands(id)){if(cur&&x.g===cur.g&&x.s===cur.s)continue;if(dynIssues(id,x.g,x.s,x.r,rest).length)continue;o.push({...x,sc:score(id,x.g,x.s,RM[x.r])})}
  o.sort((a,b)=>b.sc-a.sc);const seen=new Set(),out=[];
  for(const x of o){const k=x.g+x.s;if(seen.has(k))continue;seen.add(k);out.push({g:x.g,s:x.s,r:x.r});if(out.length>=n)break}
  return out;
}
const missingSw=e=>COURSES[e.c].sw.filter(x=>!RM[e.r].sw.includes(x));
function metrics(plan){
  const ids=Object.keys(COURSES);let viol=0,met=0,wish=0,flow=0,flowN=0;
  for(const e of plan){if(allIssues(e.c,e.g,e.s,e.r,plan).length&&!S.exc[e.c])viol++}
  for(const id of ids){const a=analyze(id,plan);if(a.st!=='none'&&a.st!=='unplaced'){wish++;if(a.st==='met')met++}
    const c=COURSES[id];if(c.kind==='기초'){flowN++;const e=plan.find(x=>x.c===id);if(e&&RM[e.r].bld===(c.set==='A'?'문화관':'정보관'))flow++}}
  return {viol,met,wish,flow,flowN,unplaced:ids.filter(id=>!plan.some(e=>e.c===id)).length};
}

function mkMsgs(){
  const out=[];
  for(const id of openConflicts()){
    const a=analyze(id),c=COURSES[id],cur=S.plan.find(e=>e.c===id),to=S.cf[id]||{};
    if(to[c.p]!==false){
      const q=fullReq(id);
      const body=a.st==='rule'
        ?`${pn(c.p)}님, 2027-1학기 시간표 초안을 안내드립니다.\n\n「${nm(id)}」은(는) 희망하신 ${ptime(a.want)}이 학사팀 공문의 ${blockOf(a.want.g,a.want.s)} 시간이라 전공 수업을 둘 수 없어, 임시로 ${place(cur)}에 두었습니다.\n\n아래 대안 중 가능한 시간을 골라 주세요. 다른 사정이 있으시면 글로 적어 주셔도 됩니다.`
        :`${pn(c.p)}님, 2027-1학기 시간표 초안을 안내드립니다.\n\n「${nm(id)}」은(는) 희망하신 ${ptime(a.want)}에 다음 이유로 배치하지 못해, 임시로 ${place(cur)}에 두었습니다.\n· ${a.why}${q&&q.yield?'\n(희망 입력 때 양보·조정이 가능하다고 적어 주신 내용을 참고했습니다.)':''}\n\n아래 대안 중 가능한 시간을 골라 주시거나 사정을 적어 주세요. 임시안이 괜찮으시면 '현재대로'를 골라 주세요.`;
      out.push({id:'M'+(S.seq++),to:c.p,c:id,grp:id,kind:a.st==='rule'?'rule':'moved',alts:altsFor(id),body,status:'sent',sent:1,reply:null});
    }
    for(const bid of (a.with||[])){
      const bp=COURSES[bid].p;if(bp===c.p||!to[bp])continue;
      const be=S.plan.find(e=>e.c===bid);
      out.push({id:'M'+(S.seq++),to:bp,c:bid,grp:id,kind:'ask',alts:altsFor(bid),status:'sent',sent:1,reply:null,
        body:`${pn(bp)}님, 「${nm(bid)}」(${place(be)})과 같은 시간을 희망하신 교수님이 계셔서 조율을 여쭙니다.\n\n혹시 아래 시간도 가능하시면 골라 주세요. 어려우시면 '현재대로'를 골라 주시면 지금 배치가 그대로 유지됩니다.`});
    }
  }
  return out;
}
function hypo(ops){const p=clone(S.plan);for(const o of ops){const e=p.find(x=>x.c===o.c);if(e)Object.assign(e,{g:o.g,s:o.s,r:o.r});else p.push({...o})}return p}
function restoreOps(plan2,skip){
  const out=[];
  for(const id of openConflicts()){
    if(skip.includes(id))continue;const a=analyze(id,plan2);if(a.st!=='peer')continue;
    const w=a.want,rest=plan2.filter(e=>e.c!==id);let best=null,bs=-1e9;
    for(const r of ROOMS){if(staticIssues(id,w.g,w.s,r.id).length||dynIssues(id,w.g,w.s,r.id,rest).length)continue;const sc=score(id,w.g,w.s,r);if(sc>bs){bs=sc;best=r.id}}
    if(best){const o={c:id,g:w.g,s:w.s,r:best};out.push(o);const e=plan2.find(x=>x.c===id);Object.assign(e,o)}
  }
  return out;
}
function findFor(id,p){
  const rest=S.plan.filter(e=>e.c!==id);let best=null,bs=-1e9,firstIss=null;
  const days=p.days?[p.days]:['mw','tt'].filter(g=>g!==p.avoidD),slots=p.slots.length?p.slots:[0,1,2,3,4,5].filter(s=>!p.avoidS.includes(s));
  for(const g of days)for(const s of slots)for(const r of ROOMS){
    if(p.bld&&r.bld!==p.bld)continue;
    const iss=allIssues(id,g,s,r.id,rest);if(iss.length){if(!firstIss)firstIss={g,s,iss};continue}
    const sc=score(id,g,s,r);if(sc>bs){bs=sc;best={g,s,r:r.id}}
  }
  return best?{ok:true,pl:best}:{ok:false,iss:firstIss};
}
function aiPlan(m){
  const id=m.c,cur=S.plan.find(e=>e.c===id),R=m.reply;let cls,interp=null,ops=[],say='',manual=false;
  if(R.choice.startsWith('alt')){cls='수용';ops=[{c:id,...m.alts[+R.choice.slice(3)]}]}
  else if(R.choice==='keep'){cls=m.kind==='ask'?'거절':'수용'}
  else{interp=parseReply(R.text);cls=interp.cls;
    if(cls==='조건부'){const f=findFor(id,interp);if(f.ok)ops=[{c:id,...f.pl}];else{say=`회신에서 ${nlpTags(interp,interp).join(', ')} 조건을 읽었습니다. 그런데 ${f.iss?`${ptime(f.iss)}에는 ${f.iss.iss[0]}`:'조건에 맞는 강의실이 없어'} 옮길 수 없습니다. 지금 배치(${place(cur)})를 유지하고 이유를 회신하겠습니다.`}}
    else if(cls==='거절'&&m.kind!=='ask'){manual=true;say=`임시안도 어렵다고 하셨지만 가능한 조건이 적혀 있지 않습니다. 대안을 다시 보내거나 직접 연락해 주세요.`}
    else if(cls==='확인 필요'){manual=true;say='회신 내용으로 처리 방향을 정하기 어렵습니다. 직접 확인해 주세요.'}}
  let rest=[];
  if(ops.length){const p2=hypo(ops);rest=restoreOps(p2,[id])}
  if(!say){
    if(ops.length){const o=ops[0];say=`「${nm(id)}」을(를) ${place(o)}로 옮기고`;
      if(rest.length)say+=`, 비게 된 시간에 「${nm(rest[0].c)}」을(를) 원래 희망대로 ${place(rest[0])}에 배치하고`;
      say+=` ${rest.length?'두 교수님께':`${pn(m.to)}님께`} 반영 결과를 알리겠습니다.`;
      if(interp)say=`회신에서 ${nlpTags(interp,interp).join(', ')} 조건을 읽었습니다. `+say}
    else if(m.kind==='ask')say=`「${nm(id)}」은(는) 현재대로(${place(cur)}) 유지하겠습니다. 같은 시간을 희망한 「${nm(m.grp)}」은(는) 그쪽 회신으로 정하겠습니다.`;
    else say=`「${nm(id)}」은(는) 지금 임시안(${place(cur)})대로 두고 조율 완료로 표시하겠습니다.`;
  }
  return {cls,interp,ops:[...ops,...rest],say,manual};
}
function notice(to,c,body){S.msgs.push({id:'M'+(S.seq++),to,c,grp:c,kind:'notice',body,status:'done',at:stamp()});ev(to,'out','반영 결과',body,c)}
function closeGroup(m,P){
  m.status='done';m.result=P.say;S.done[m.grp]=true;
  for(const x of S.msgs){if(x!==m&&x.grp===m.grp&&x.kind!=='notice'&&x.status!=='done'){x.status='done';x.result='다른 교수님 회신으로 조율 완료';const moved=P.ops.find(o=>o.c===x.c);if(!moved)notice(x.to,x.c,`「${nm(x.c)}」 조율이 끝나 지금 배치(${place(S.plan.find(e=>e.c===x.c))})가 유지됩니다. 회신하지 않으셔도 됩니다.`)}}
}
function applyPlan(m){
  const P=aiPlan(m);
  for(const o of P.ops){const e=S.plan.find(x=>x.c===o.c);Object.assign(e,{g:o.g,s:o.s,r:o.r});S.lock[o.c]={...e};S.done[o.c]=true;notice(COURSES[o.c].p,o.c,`「${nm(o.c)}」을(를) ${place(e)}로 반영했습니다.`)}
  if(!P.ops.length){const e=S.plan.find(x=>x.c===m.c);notice(m.to,m.c,m.kind==='ask'?`회신 감사합니다. 「${nm(m.c)}」은(는) 현재대로(${place(e)}) 유지됩니다.`:`「${nm(m.c)}」은(는) ${place(e)}로 확정 안에 반영했습니다.`)}
  closeGroup(m,P);
  log(`AI 처리안 적용: ${nm(m.c)}`,P.say);
}

  const cards=openConflicts().map(id=>{

    return `<div class="cf" id="cf-${id}"><div class="row between"><b>${E(nm(id))} · ${pn(c.p)}</b><span class="pill ${a.st==='rule'?'p-bad':'p-warn'}">${a.st==='rule'?'규칙 때문에 조정':a.st==='peer'?'희망 겹침':'일부 조정'}</span></div>
     <dl class="kv" style="margin-top:8px"><dt>희망</dt><dd>${ptime(a.want)}</dd><dt>이유</dt><dd>${E(a.why)}</dd><dt>임시 배치</dt><dd>${place(e)}</dd><dt>대안</dt><dd>${altsFor(id).map(x=>ptime(x)).join(' / ')||'없음'}</dd></dl>
     <div style="margin-top:8px"><span class="lbl">메시지 받을 교수님</span>${ppl}<p class="note" style="margin:2px 0 0">연차는 참고로만 보여 주며, 메시지에는 연차나 상대 교수님 이름을 쓰지 않습니다.</p></div></div>`}).join('');
  const inst=S.plan.filter(e=>missingSw(e).length);
  return `<div class="head"><h1>자동 배정</h1></div>${tiles}
  <div class="cols cfg" style="margin-top:16px">${cfg}<div class="stack">
   <div class="panel"><div class="row between"><h2 style="margin:0">희망 겹침·규칙 조정 ${openConflicts().length}건</h2><button class="btn small" data-act="tab" data-t="시간표">시간표에서 보기</button></div><p class="note">초안을 공개하면 체크한 교수님께 메시지가 자동으로 갑니다.</p>${cards||'<div class="empty">겹침이 없습니다.</div>'}</div>
   ${inst.length?`<div class="panel"><h2>실습실 설치 할 일</h2>${inst.map(e=>`<div class="note">${RM[e.r].bld} ${RM[e.r].no}: ${missingSw(e).join(', ')} 설치 (${E(nm(e.c))})</div>`).join('')}</div>`:''}
  </div></div>`;
}
function vCoord(){
  if(S.stage<2)return `<div class="head"><h1>조율</h1></div><div class="panel empty">초안을 공개하면 교수님 회신이 여기에 모입니다.</div>`;
  const ms=S.msgs.filter(m=>m.kind!=='notice'&&m.kind!=='remind');
  const rep=ms.filter(m=>m.status==='replied'),wait=ms.filter(m=>m.status==='sent'),done=ms.filter(m=>m.status==='done');
  if(!S.icur||!ms.some(m=>m.id===S.icur&&m.status==='replied'))S.icur=rep[0]?.id||null;
  const it=m=>`<button class="item" id="ci-${m.id}" data-act="icur" data-id="${m.id}" aria-current="${m.id===S.icur}"><div class="row between"><b>${E(nm(m.c))} · ${PROFS[m.to].name}</b><span class="pill p-warn">처리 대기</span></div><span class="note">${E(replyText(m))}</span></button>`;
  const left=`<div class="stack"><div><h2>받은 회신 ${rep.length}건</h2><div class="list">${rep.map(it).join('')||'<div class="panel empty" style="padding:14px">새 회신이 없습니다.</div>'}</div></div>
   <div class="panel"><h2>보낸 메시지</h2><div class="tbl"><table><tbody>${[...wait,...done].map(m=>`<tr><td>${E(nm(m.c))} · ${PROFS[m.to].name}<div class="note">${m.kind==='ask'?'조율 문의':'확인 요청'} · 연락 ${m.sent}회</div></td><td style="text-align:right">${m.status==='sent'?`<span class="pill p-warn">회신 대기</span> <button class="btn small" data-act="resend" data-id="${m.id}">다시 알림</button>`:'<span class="pill p-good">완료</span>'}</td></tr>`).join('')||'<tr><td class="muted">없음</td></tr>'}</tbody></table></div></div></div>`;
  let right='<div class="panel empty">처리할 회신을 고르세요.</div>';
  const m=S.msgs.find(x=>x.id===S.icur);
  if(m&&m.status==='replied'){
    const P=aiPlan(m),cur=S.plan.find(e=>e.c===m.c);
    const it2=P.interp;
    right=`<div class="panel"><div class="row between"><h2 style="margin:0">${E(nm(m.c))} · ${pn(m.to)}</h2><span class="pill p-mute">${m.kind==='ask'?'조율 문의 회신':'확인 요청 회신'}</span></div>
     <dl class="kv" style="margin-top:10px"><dt>현재 배치</dt><dd>${place(cur)}</dd></dl>
     <div class="quote">${E(replyText(m))}</div>
     <div class="ai"><div><span class="k">AI 해석</span><span class="pill ${P.cls==='수용'?'p-good':P.cls==='조건부'?'p-acc':P.cls==='거절'?'p-bad':'p-warn'}">${P.cls}</span></div>
      ${it2?`<div><span class="k">조건</span>${E(nlpTags(it2,it2).join(' · ')||'없음')}</div><div><span class="k">이유</span>${it2.reasons.join(', ')}</div>`:m.reply.choice.startsWith('alt')?`<div><span class="k">선택</span>${place(m.alts[+m.reply.choice.slice(3)])}</div>`:''}</div>
     <div class="aiact"><span class="note" style="color:var(--accent);font-weight:600">AI 처리안</span><p class="say">"${E(P.say)}"</p>
      <div class="row">${P.manual?`<button class="btn primary" id="ai-resend" data-act="resend" data-id="${m.id}">대안 다시 보내기</button>`:`<button class="btn primary" id="ai-do" data-act="aido" data-id="${m.id}">이대로 처리</button>`}
      ${P.ops.length?`<button class="btn" data-act="aikeep" data-id="${m.id}">현재대로 유지하고 회신</button>`:''}
      <button class="btn" data-act="aimanual" data-id="${m.id}">시간표에서 수기 변경</button></div></div></div>`;
  }
  return `<div class="head"><h1>조율</h1><p class="muted">교수님 회신을 AI가 해석해 처리안을 만듭니다. 누르면 그대로 처리되고 교수님께 결과가 갑니다.</p></div><div class="cols side">${left}${right}</div>
  ${done.length?`<details style="margin-top:16px"><summary>처리 끝난 조율 ${done.length}건</summary><div class="tbl" style="margin-top:8px"><table><tbody>${done.map(m=>`<tr><td>${E(nm(m.c))} · ${PROFS[m.to].name}</td><td>${E(m.result||'')}</td></tr>`).join('')}</tbody></table></div></details>`:''}`;
}
function replyText(m){if(!m.reply)return '';const c=m.reply.choice;return c==='keep'?'현재대로':c.startsWith('alt')?`대안 선택: ${ptime(m.alts[+c.slice(3)])}`:m.reply.text}
function vLog(){
  return `<div class="head"><h1>기록</h1></div><div class="panel"><div class="tbl"><table style="min-width:760px"><thead><tr><th>시각</th><th>단계</th><th>누가</th><th>무엇을</th><th>사유·처리안</th></tr></thead><tbody>${S.log.map(l=>`<tr><td class="mono">${l.at}</td><td>${l.st}</td><td>${E(l.who)}</td><td>${E(l.what)}</td><td>${E(l.why)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">기록이 없습니다.</td></tr>'}</tbody></table></div></div>`;
}

/* ===== 지난 단계 기록 ===== */
function vHist(i){
  let body='';
  if(i===0){body=vSecHist()}
  else if(i===1){const p=S.snaps.draft;body=p?`<p class="note">자동 배정 직후의 초안입니다.</p>${histGrid(p)}<div class="panel" style="margin-top:12px"><h2>그때의 겹침</h2>${Object.keys(COURSES).filter(id=>OPEN_ST.includes(analyze(id,p).st)).map(id=>{const a=analyze(id,p);return `<div class="note">${E(nm(id))}: 희망 ${ptime(a.want)} → ${place(p.find(e=>e.c===id))} · ${E(a.why)}</div>`}).join('')||'<span class="note">없음</span>'}</div>`:'<div class="panel empty">기록이 없습니다.</div>'}
  else if(i===2){const ms=S.msgs.filter(m=>m.kind!=='notice');body=`<div class="panel"><div class="tbl"><table style="min-width:760px"><thead><tr><th>과목</th><th>받는 교수</th><th>종류</th><th>연락</th><th>회신</th><th>처리</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${E(nm(m.c))}</td><td>${pn(m.to)}</td><td>${{moved:'확인 요청',rule:'확인 요청',ask:'조율 문의',remind:'입력 안내'}[m.kind]}</td><td>${m.sent||1}회</td><td>${E(replyText(m)||'—')}</td><td class="note">${E(m.result||(m.status==='sent'?'회신 대기':''))}</td></tr>`).join('')}</tbody></table></div></div>`}
  return `<div class="hist"><div class="row between"><b>${i+1}단계 「${STAGES[i]}」 기록을 보고 있습니다</b><button class="btn small" id="back-now" data-act="backnow">현재 단계로 돌아가기</button></div></div>${body}`;
}
function histGrid(p){return grid((d,g,s)=>{if(!g)return '<td class="off"></td>';const es=p.filter(e=>e.g===g&&e.s===s);return `<td>${es.map(e=>`<div class="chip y${COURSES[e.c].y}" style="cursor:default"><b>${E(nm(e.c))}</b><span>${RM[e.r].no} · ${PROFS[COURSES[e.c].p].name}</span></div>`).join('')}</td>`})}
function vSecHist(){
  const ids=Object.keys(COURSES);
  return `<div class="panel"><h2>접수 마감 때의 희망 원본</h2><div class="tbl"><table style="min-width:760px"><thead><tr><th>과목</th><th>담당</th><th>칸 입력</th><th>기타 요청</th><th>제출</th></tr></thead><tbody>${ids.map(id=>{const q=S.snaps.req0?S.snaps.req0[id]:S.req[id];return `<tr><td>${E(nm(id))}</td><td>${owner(id)}</td><td>${q&&q.sub?`${q.days?GL[q.days]:'요일 무관'} · ${q.slots.length?q.slots.map(s=>SLOTS[s]).join('·'):'시간 무관'}${q.bld?` · ${q.bld}`:''}`:'미제출'}</td><td>${q&&q.text?`"${E(q.text)}"`:'—'}</td><td class="note">${S.subAt[id]||''}</td></tr>`}).join('')}</tbody></table></div></div>`;
}

/* ===== 렌더 ===== */
function view(){
  const t=S.tab;
  if(S.role==='prof')return t==='희망 입력'?vPReq():t==='메시지'?vPMsg():vTT();
  return {현황:vDash,'분반·희망':vSec,'자동 배정':vAuto,조율:vCoord,시간표:vTT,기록:vLog}[t]();
}
function render(){const y=scrollY;$('#app').innerHTML=S.role?vShell(view()):vLogin();scrollTo(0,y)}

/* ===== 동작 ===== */
function doNext(){
  if(S.stage===0){S.snaps.req0=JSON.parse(JSON.stringify(S.req));Object.keys(COURSES).forEach(id=>S.named[id]=true);S.stage=1;S.tab='자동 배정';log('희망 접수 마감',`제출 ${Object.keys(COURSES).filter(id=>S.req[id]&&S.req[id].sub).length}/${Object.keys(COURSES).length}`);toast('접수를 마감했습니다. 조건을 정하고 자동 배정을 실행하세요.')}
  else if(S.stage===1){const ms=mkMsgs();ms.forEach(m=>{m.at=stamp();ev(m.to,'out',{moved:'배정 확인 요청',rule:'배정 확인 요청 (규칙)',ask:'조율 문의'}[m.kind],`「${nm(m.c)}」 ${m.kind==='ask'?'같은 시간을 희망한 분이 있어 조율 문의':'임시 배치 '+place(S.plan.find(e=>e.c===m.c))+' 확인 요청'}`,m.c)});S.msgs.push(...ms);S.snaps.open=clone(S.plan);S.stage=2;S.tab='조율';log('초안 공개·조율 메시지 발송',`${ms.length}통`);toast(`초안을 공개하고 메시지 ${ms.length}통을 보냈습니다.`)}
  else if(S.stage===2){S.snaps.final=clone(S.plan);S.stage=3;S.tab='현황';S.showExport=true;log('시간표 확정');toast('확정했습니다. 현황 아래 SAP 입력용 표를 보세요.')}
}
function runAuto(){
  S.lock={};S.done={};S.exc={};
  S.plan=solve(Object.keys(COURSES),[]);S.snaps.draft=clone(S.plan);
  S.cf={};
  for(const id of openConflicts()){const a=analyze(id),c=COURSES[id],q=fullReq(id),to={[c.p]:true};for(const b of (a.with||[])){const bp=COURSES[b].p;if(bp!==c.p)to[bp]=!(q&&q.yield)}S.cf[id]=to}
  const mt=metrics(S.plan);log('자동 배정 실행',`위반 ${mt.viol} · 희망 반영 ${mt.met}/${mt.wish} · 조율 ${openConflicts().length}건`);
  toast(`배정안을 만들었습니다. 조율 필요 ${openConflicts().length}건`);
}
function login(r){
  S.role=r;S.viewStage=null;S.sel=null;S.ask=false;S.dsel=null;S.dprof=null;
  if(r==='prof'){S.me=$('#lp').value;S.tab=S.stage===0?'희망 입력':S.msgs.some(m=>m.to===S.me&&m.status==='sent')?'메시지':'시간표'}
  else S.tab=MENUS[r][0];
  if(r==='office'&&S.stage===2&&S.msgs.some(m=>m.status==='replied'))S.tab='조율';
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,d=b.dataset;
  switch(a){
    case 'login':login(d.r);break;
    case 'logout':S.role=null;S.me=null;break;
    case 'tab':S.tab=d.t;S.viewStage=null;S.sel=null;break;
    case 'vstage':S.viewStage=+d.i;break;
    case 'backnow':S.viewStage=null;break;
    case 'next':S.ask=true;break;
    case 'no':S.ask=false;break;
    case 'yes':S.ask=false;doNext();break;
    case 'export':S.tab='현황';S.showExport=true;render();$('#export')?.scrollIntoView();return;
    case 'run':runAuto();break;
    case 'tview':S.tt.view=d.v;break;
    case 'sel':S.sel=S.sel===d.c?null:d.c;break;
    case 'unsel':S.sel=null;break;
    case 'mvapply':{
      const g=$('#mv-g').value,s=+$('#mv-s').value,r=$('#mv-r').value,why=$('#mv-why').value.trim();
      const iss=allIssues(S.sel,g,s,r,S.plan);
      if(iss.length&&!why){toast('규칙을 어기는 변경은 사유를 적어야 합니다.');return}
      const ent=S.plan.find(x=>x.c===S.sel);const before=place(ent);Object.assign(ent,{g,s,r});S.lock[S.sel]={...ent};
      if(iss.length)S.exc[S.sel]=why;else delete S.exc[S.sel];
      log(`수기 변경: ${nm(S.sel)} ${before} → ${place(ent)}`,(iss.length?'[규칙 예외] ':'')+(why||'사유 없음'));
      if(S.stage>=2)notice(COURSES[S.sel].p,S.sel,`「${nm(S.sel)}」이(가) ${place(ent)}로 변경되었습니다.${why?` (사유: ${why})`:''}`);
      toast(iss.length?'규칙 예외로 저장했습니다.':'변경했습니다.');break}
    case 'placenew':{const before=S.plan.length;S.plan=solve(Object.keys(COURSES),S.plan);log('미배치 분반 자동 배치',`${S.plan.length-before}개`);toast(`${S.plan.length-before}개 분반을 배치했습니다.`);break}
    /* 교수 희망 */
    case 'claim':{const c=COURSES[d.c];c.p=S.me;S.named[d.c]=true;log(`담당 입력: ${nm(d.c)}`,pn(S.me));ev(S.me,'in','담당 입력',`「${nm(d.c)}」 담당으로 이름 입력`,d.c);toast('이름을 적었습니다. 아래에서 희망을 입력해 주세요.');break}
    case 'rqd':{const q=S.req[d.c];q.days=d.v;break}
    case 'rqs':{const q=S.req[d.c],v=+d.v;q.slots=q.slots.includes(v)?q.slots.filter(x=>x!==v):[...q.slots,v].sort((x,y)=>x-y);break}
    case 'rsub':{const q=S.req[d.c];const was=q.sub;q.sub=true;S.msgs.filter(m=>m.c===d.c&&m.kind==='remind').forEach(m=>{m.status='done';m.result='희망 제출함'});S.subAt[d.c]='12/01 '+now();log(`${was?'희망 수정':'희망 제출'}: ${nm(d.c)}`,q.text);ev(COURSES[d.c].p,'in',was?'희망 수정':'희망 제출',`「${nm(d.c)}」 ${q.days?GL[q.days]:'요일 무관'} · ${q.slots.length?q.slots.map(x=>SLOTS[x]).join('·'):'시간 무관'}${q.text?` · "${q.text}"`:''}`,d.c);toast('제출했습니다.');break}
    case 'mcur':S.mcur=d.id;break;
    case 'rsend':{
      const m=S.msgs.find(x=>x.id===S.mcur);const v=document.querySelector('input[name="rp"]:checked')?.value;const t=$('#rp-text').value.trim();
      const choice=t&&v!=='keep'&&!(v||'').startsWith('alt')||v==='text'?'text':v;
      if(choice==='text'&&!t){toast('회신 내용을 적어 주세요.');return}
      m.reply={choice,text:t};m.status='replied';log(`교수 회신: ${nm(m.c)}`,replyText(m));ev(m.to,'in','회신',`「${nm(m.c)}」 ${replyText(m)}`,m.c);toast('회신을 보냈습니다.');break}
    /* 조교 */
    case 'remind':{const p=COURSES[d.c].p;S.msgs.push({id:'M'+(S.seq++),to:p,c:d.c,grp:d.c,kind:'remind',status:'sent',sent:1,at:stamp(),body:`${pn(p)}님, 2027-1학기 희망 시간 입력을 다시 안내드립니다.\n\nSSU:room에서 「${nm(d.c)}」의 희망 요일·시간을 입력해 주세요. 이 안내는 메일로도 함께 보냈습니다.`});log(`희망 입력 알림: ${pn(p)}`);ev(p,'out','희망 입력 재안내',`「${nm(d.c)}」 희망 입력을 다시 요청 (메일 함께 발송)`,d.c);toast('알림을 보냈습니다.');break}
    case 'icur':S.icur=d.id;break;
    case 'dsel':S.dsel=S.dsel===d.k?null:d.k;S.dprof=null;render();$('#dpanel')?.scrollIntoView({block:'nearest'});return;
    case 'dprof':S.dprof=S.dprof===d.p?null:d.p;break;
    case 'goreply':S.tab='조율';S.icur=d.id;break;
    case 'aido':{const m=S.msgs.find(x=>x.id===d.id);applyPlan(m);toast('처리하고 교수님께 결과를 보냈습니다.');S.icur=null;break}
    case 'aikeep':{const m=S.msgs.find(x=>x.id===d.id);const P={ops:[],say:'현재대로 유지'};notice(m.to,m.c,`「${nm(m.c)}」은(는) 현재대로(${place(S.plan.find(e=>e.c===m.c))}) 유지됩니다.`);closeGroup(m,P);log(`현재대로 유지: ${nm(m.c)}`,'조교 판단');toast('현재대로 유지하고 회신했습니다.');break}
    case 'aimanual':{const m=S.msgs.find(x=>x.id===d.id);S.tab='시간표';S.tt.when='now';S.tt.view='major';S.sel=m.c;break}
    case 'resend':{const m=S.msgs.find(x=>x.id===d.id);m.sent=(m.sent||1)+1;m.status='sent';m.reply=null;m.alts=altsFor(m.c);log(`다시 알림: ${nm(m.c)} · ${pn(m.to)}`,`${m.sent}회째`);ev(m.to,'out','다시 알림',`「${nm(m.c)}」 ${m.sent}번째 안내`,m.c);toast('다시 보냈습니다.');break}
    case 'dl':{const t=$('#csv');t.focus();t.select();toast('선택했습니다. 복사해서 엑셀이나 SAP 입력에 쓰세요.');return}
    default:return;
  }
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.w){S.W[t.dataset.w]=+t.value;const v=$('#wv-'+t.dataset.w);if(v)v.textContent=t.value;return}
  if(t.dataset.rq==='text'||t.dataset.rq==='sw'){S.req[t.dataset.c][t.dataset.rq]=t.value;const box=$('#ai-'+t.dataset.c);if(box)box.innerHTML=aiBox(t.dataset.c);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.k){S.tt[t.dataset.k]=t.value;S.sel=null;render();return}
  if(t.dataset.rq==='bld'){S.req[t.dataset.c].bld=t.value;const box=$('#ai-'+t.dataset.c);if(box)box.innerHTML=aiBox(t.dataset.c);return}
  if(t.id==='mv-g'||t.id==='mv-s'||t.id==='mv-r'){$('#mv-iss').innerHTML=mvIss();return}
  if(t.dataset.cf){const id=t.dataset.cf;S.cf[id]=S.cf[id]||{};S.cf[id][t.dataset.p]=t.checked;return}
  if(t.dataset.res!==undefined&&t.dataset.res){S.reserve[t.dataset.res]=t.value;render();return}
  if(t.name==='rp'&&t.value!=='text'){}
});
render();
</script>
