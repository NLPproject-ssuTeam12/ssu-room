<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSU:room 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 11/15 시안 v4: 희망은 선택칸(시간 칠하기 등)으로 받고, NLP는 조율 회신 해석 · 조율 메시지 · AI 도우미에 쓴다 */
:root{
  --bg:#F6F3EF; --surface:#FFFFFF; --sunk:#F1EDE8; --line:#E4DDD5; --ink:#2E2925; --muted:#756C64;
  --accent:#B65A39; --accent-soft:#FBEDE6; --accent-ink:#FFFFFF;
  --good:#3F7F52; --good-soft:#E5F1E7; --warn:#9A6210; --warn-soft:#FBF0DC; --bad:#B8433A; --bad-soft:#FAE6E3;
  --lab:#4F64A8; --lab-soft:#E9EDF8;
  --font:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171412; --surface:#211D1A; --sunk:#1B1816; --line:#36302B; --ink:#EEE8E2; --muted:#A79C92;
  --accent:#E58A66; --accent-soft:#3A251C; --accent-ink:#1A1310;
  --good:#7CC08E; --good-soft:#1C2E21; --warn:#E3AE5A; --warn-soft:#33270F; --bad:#EE8A80; --bad-soft:#3A1C19;
  --lab:#9DB0EE; --lab-soft:#1F2640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171412; --surface:#211D1A; --sunk:#1B1816; --line:#36302B; --ink:#EEE8E2; --muted:#A79C92;
  --accent:#E58A66; --accent-soft:#3A251C; --accent-ink:#1A1310;
  --good:#7CC08E; --good-soft:#1C2E21; --warn:#E3AE5A; --warn-soft:#33270F; --bad:#EE8A80; --bad-soft:#3A1C19;
  --lab:#9DB0EE; --lab-soft:#1F2640; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
/* 상단 바 */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}.logo b{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.virt{font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:2px 10px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
select{max-width:100%}
textarea{width:100%;resize:vertical;min-height:58px}
input[type=text]{width:100%}
/* 단계 바 */
.steps{display:flex;gap:6px;padding:14px 0 6px;overflow-x:auto}
.step{flex:1;min-width:92px;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 6px;border-radius:9px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.step.done{color:var(--good);background:var(--good-soft);border-color:transparent}
.step.now{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
/* 본문 */
.main{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;padding:12px 0 40px}
nav{display:flex;flex-direction:column;gap:3px;position:sticky;top:12px;align-self:start}
nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
nav button:hover{background:var(--sunk)}
nav button.on{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.badge{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;min-width:18px;text-align:center}
h1{font-size:22px;margin:4px 0 4px;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12.5px}
.btn{white-space:nowrap;font-weight:600;border-radius:9px;padding:8px 15px;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 11px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--ink);white-space:nowrap;margin:0 4px 4px 0}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.lab{background:var(--lab-soft);color:var(--lab)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.flag td{background:var(--warn-soft)}
.raw{font-size:13px}.raw span{color:var(--muted);font-size:11.5px;margin-right:4px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
pre{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:12px;overflow-x:auto;margin:6px 0 0;font-family:Consolas,ui-monospace,monospace;white-space:pre-wrap}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:9px;padding:8px 12px}
.who{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-right:6px}
.who.ai{background:var(--accent-soft);color:var(--accent)}.who.sv{background:var(--good-soft);color:var(--good)}.who.ta{background:var(--warn-soft);color:var(--warn)}.who.code{background:var(--sunk);color:var(--muted)}
/* 시간표 */
.ttwrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:62px repeat(5,minmax(118px,1fr));gap:4px;min-width:700px}
.tt .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.tt .t{font-size:12px;color:var(--muted);padding-top:6px;line-height:1.3}
.tt .t span{font-size:11px;opacity:.8}
.tt .cell{background:var(--sunk);border-radius:8px;min-height:62px;padding:4px;display:flex;flex-direction:column;gap:4px}
.blk{border-radius:7px;padding:5px 7px;background:var(--surface);border:1px solid var(--line);font-size:12px;line-height:1.35}
.blk b{display:block;font-size:12.5px}
.blk.temp{background:var(--warn-soft);border-color:var(--warn)}
.blk.changed{box-shadow:0 0 0 2px var(--good)}
.blk.mine{background:var(--accent-soft);border-color:var(--accent)}
.blk.dim{opacity:.4}
/* 시간 칠하기 */
.pw{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px}
.pg{display:grid;grid-template-columns:50px repeat(5,1fr);gap:4px;max-width:440px;touch-action:none;user-select:none;-webkit-user-select:none}
.pgh,.pgt{font-size:12px;color:var(--muted);font-weight:700;padding:3px 0;text-align:center}
.pgt{text-align:left;align-self:center}
.pc{height:32px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink);padding:0}
.pc:disabled{cursor:default}
.m-must{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.m-want{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.m-no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mm{display:inline-grid;grid-template-columns:22px repeat(5,12px);gap:2px;font-size:10px;color:var(--muted);line-height:13px;margin-top:4px}
.mm span{text-align:center}
.mc{width:12px;height:13px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px;background:var(--sunk)}
.mc.m-must,.legend i.m-must{background:var(--accent);border-color:var(--accent)}
.mc.m-want,.legend i.m-want{background:var(--good-soft);border-color:var(--good)}
.mc.m-no,.legend i.m-no{background:repeating-linear-gradient(135deg,var(--bad) 0 2px,var(--bad-soft) 2px 4px);border-color:var(--bad)}
/* 조율 */
.msg{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.65}
.alt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.alt .k{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.alt input{accent-color:var(--accent)}
.chk{font-size:12.5px;margin:3px 0}.chk.ok{color:var(--good)}.chk.no{color:var(--bad)}
.prop{border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:10px}
.prop .big{font-size:18px;font-weight:800}
.vs{font-size:13px;margin:3px 0}
.decided{background:var(--good-soft);color:var(--good);border-radius:9px;padding:8px 12px;font-weight:600;margin-top:10px}
.log li{margin-bottom:4px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.flow .b{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--surface)}
.flow .a{color:var(--muted)}
.lbl{font-size:12.5px;font-weight:600;margin:10px 0 4px}
/* AI 도우미 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:620px;overflow-y:auto;padding-right:4px}
.turn{max-width:82%}
.turn.ta{align-self:flex-end;background:var(--accent-soft);border-radius:14px 14px 4px 14px;padding:9px 13px}
.turn.bot{align-self:flex-start;background:var(--sunk);border-radius:14px 14px 14px 4px;padding:12px 14px;width:82%}
.trace{font-size:12px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.trace>div{margin-top:5px}
.trace code{font-family:Consolas,ui-monospace,monospace;font-size:11.5px;background:var(--surface);padding:1px 6px;border-radius:4px;color:var(--ink);word-break:break-all}
.chg{margin-top:8px;background:var(--surface);border-radius:8px}
.chg th,.chg td{padding:6px 8px;font-size:12.5px}
/* AI 도우미 패널: 어느 화면에서나 오른쪽에서 열린다 */
.botfab{position:fixed;right:24px;bottom:24px;z-index:30;display:flex;align-items:center;gap:12px;border:0;border-radius:999px;padding:10px 24px 10px 10px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:left;box-shadow:0 10px 30px rgba(182,90,57,.45),0 2px 6px rgba(0,0,0,.18);transition:transform .15s}
.botfab:hover{transform:translateY(-2px);filter:brightness(1.06)}
.botfab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.botfab .ic{width:42px;height:42px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.botfab b{display:block;font-size:16px;line-height:1.25}
.botfab small{display:block;font-size:12.5px;font-weight:500;opacity:.9}
.botfab.new{animation:fabpulse 2.2s ease-out infinite}
@keyframes fabpulse{0%{box-shadow:0 10px 30px rgba(182,90,57,.45),0 0 0 0 rgba(229,138,102,.55)}100%{box-shadow:0 10px 30px rgba(182,90,57,.45),0 0 0 18px rgba(229,138,102,0)}}
@media (prefers-reduced-motion:reduce){.botfab.new{animation:none}.botfab{transition:none}}
@media (max-width:820px){.botfab{right:16px;bottom:16px;padding-right:18px}.botfab small{display:none}}
.botpanel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column}
.bph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bph b{font-size:15px}
.botpanel .chat{flex:1;max-height:none;padding:14px}
.botpanel form{border-top:1px solid var(--line);padding:10px 14px 14px}
.botpanel .turn{max-width:90%}
.botpanel .turn.bot{width:100%;max-width:100%}
.botex{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
@media (min-width:1121px){#app.botopen{padding-right:400px}}
.blk.leave{opacity:.55;border-style:dashed}
.blk.ghost{background:var(--accent-soft);border:1.5px dashed var(--accent);color:var(--accent)}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr)}
  nav{flex-direction:row;overflow-x:auto;position:static}
  nav button{white-space:nowrap;gap:6px}
  nav button.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .cols,.pw{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .turn,.turn.bot{max-width:100%;width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------------- 기본 값 ----------------
const SLOTS=['09:00','10:30','12:00','13:30','15:00','16:30','18:00'];   // 75분 수업
const DAYN='월화수목금';
const D5=[0,1,2,3,4];
// 주 2회 수업: 월~금 중 두 요일을 자유롭게 묶고, 두 번 다 같은 시각에 75분씩 (키 '02' = 월·수, '14' = 화·금)
// 주 1회 연강: 하루에 75분 칸 두 개를 이어서 (키 'L2' = 수요일 연강). n = 한 번에 차지하는 칸 수
const PAT={};for(let a=0;a<5;a++)for(let b=a+1;b<5;b++)PAT[`${a}${b}`]={days:[a,b],label:DAYN[a]+'·'+DAYN[b],n:1};
for(let d=0;d<5;d++)PAT['L'+d]={days:[d],label:DAYN[d],n:2,long:true};
const PKEYS=Object.keys(PAT),P2=PKEYS.filter(p=>!PAT[p].long),PL=PKEYS.filter(p=>PAT[p].long);
// 주 1회 연강 선호 (3단계, 11/21 결정): 무조건 = 연강만, 선호 = 둘 다 되지만 연강 먼저, 필요 없음 = 주 2회만
const SHAPEN={none:'필요 없음 (주 2회)',pref:'선호',must:'무조건'};
const shapeKeys=f=>f.shape==='must'?PL:f.shape==='pref'?PKEYS:P2;
const lastSlot=(p,s)=>s+PAT[p].n-1;
const fits=(p,s)=>lastSlot(p,s)<SLOTS.length;
const occ=(p,s)=>PAT[p].days.flatMap(d=>R(s,lastSlot(p,s)).map(k=>[d,k]));   // 차지하는 (요일, 칸)
const patOf=(a,b)=>a<b?`${a}${b}`:`${b}${a}`;
const CHAPEL={day:3,slot:2};   // 1학년 채플 (목 12:00, 가정)
const ROOMS=[ // 순서 = 일반 강의는 문화관부터, 실습실은 305부터
  {id:'문화관 201',bldg:'문화관',lab:false,cap:60},{id:'미래관 410',bldg:'미래관',lab:false,cap:60},{id:'정보관 210',bldg:'정보관',lab:false,cap:45},
  {id:'정보관 305',bldg:'정보관',lab:true,cap:50},{id:'정보관 306',bldg:'정보관',lab:true,cap:50}];   // cap = 정원 (가상)
const BLDGS=['문화관','미래관','정보관'];
const PRIO=['그 시간 아니면 안 되는 교수님(꼭 표시)','실습실 필요','연구실 위치','집 위치','임용 날짜'];
const RULES=['교수 겹침','강의실 겹침','같은 학년 전공필수 겹침','실습실이 필요하면 실습실로','강의실 정원 ≥ 인원','교수가 불가로 칠한 시간','1학년 채플 시간(목 12:00, 가정) 비우기','단과대 건물(문화관·미래관·정보관)'];
const MARKS=['희망','불가'];
const CYC=[null,'희망','불가'];   // 칸을 누를 때마다 이 순서로 바뀜
const MCLS={꼭:'m-must',희망:'m-want',불가:'m-no'};
const mcls=m=>m?MCLS[m]||'':'';
const R=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const SIZES=R(6,12).map(i=>i*5);   // 인원: 30~60명, 5명 단위
// 칠하기 값 만들기: [[요일들, 교시들, 표시], ...] 뒤에 오는 것이 앞의 것을 덮는다
function P(spec){const p={};for(const [ds,ss,m] of spec)for(const d of ds)for(const s of ss)p[d+'-'+s]=m;return p}
// bldg = 건물 선호, room = 교수가 고른 강의실 (선택. 비우면 자동 배정). 배정은 pref(= room이 있으면 room, 없으면 bldg)를 희망으로 읽는다
const F=(spec,o={})=>{const f={paint:P(spec),lab:false,size:null,pref:null,bldg:null,room:null,must:false,shape:'none',etc:'',etcOk:false,...o};
  if(!f.bldg&&f.pref&&!f.pref.includes(' '))f.bldg=f.pref;if(f.room&&!f.bldg)f.bldg=ROOMS.find(r=>r.id===f.room).bldg;
  f.pref=f.room||f.bldg||null;return f};
// 교수가 고를 수 있는 강의실: 실습실 여부가 같고, 정원이 인원 이상이고, 건물 선호가 있으면 그 건물
const roomChoices=f=>ROOMS.filter(r=>r.lab===!!f.lab&&r.cap>=(f.size||0)&&(!f.bldg||r.bldg===f.bldg));
const fixRoom=f=>{if(f.room&&!roomChoices(f).some(r=>r.id===f.room))f.room=null;f.pref=f.room||f.bldg||null};
const emptyF=()=>F([]);

// 가상 데이터: 17개 분반. 담당 교수는 학과사무실이 미리 정한다 (11/21 결정). 같은 과목도 분반마다 한 줄. f = 교수님이 선택칸으로 낸 희망 (솔버가 그대로 읽는 값)

// ---------------- NLP: 조율 회신 해석 (시안: 키워드 규칙으로 흉내. 실제는 LLM + Pydantic) ----------------
function parseReply(text,choice){
  const t=text||'', r={kind:null,picks:[],conds:{}};
  let picks=[...t.matchAll(/(?<![A-Za-z])([ABC])(?![A-Za-z])/g)].map(m=>m[1]);
  [...t.matchAll(/(첫|두|세)\s*번째/g)].forEach(m=>picks.push({첫:'A',두:'B',세:'C'}[m[1]]));
  if(choice&&choice!=='none')picks.unshift(choice);
  const allNo=choice==='none'||/(셋\s*다|모두|전부|다)\s*(어렵|안\s?되|안\s?돼|불가|힘들)/.test(t);
  r.picks=allNo?[]:[...new Set(picks)];
  const eb=t.match(/([월화수목금])요?일?[은는]?\s*(\d{1,2})시\s*(?:전|이전|까지)/);
  if(eb)r.conds.endBefore={day:DAYN.indexOf(eb[1]),h:hr(+eb[2])};
  if(!r.picks.length){
    const ds=[];[...t.matchAll(/([월화수목금])(?=[·\s,\/요]|$)/g)].forEach(m=>{const d=DAYN.indexOf(m[1]);if(!ds.includes(d))ds.push(d)});
    if(ds.length)r.conds.days=ds.sort();   // 요일 둘 이상 = 그 안에서만, 하나 = 그 요일을 포함
    if(/늦은\s*오후/.test(t))r.conds.win=[5,6];else if(/오전/.test(t))r.conds.win=[0,1];else if(/저녁/.test(t))r.conds.win=[6,6];else if(/오후/.test(t))r.conds.win=[3,5];
  }
  const has=Object.keys(r.conds).length>0;
  r.kind=r.picks.length?(has?'조건부':'수용'):(allNo||/(어렵|안\s?되|안\s?돼|불가|힘들)/.test(t)?'거절':'확인 필요');
  return r;
}

// ---------------- 솔버 (시안: 우선순위 순서 배정으로 흉내. 실제는 OR-Tools CP-SAT) ----------------
// 강의실은 요일마다 기록한다 (주 2회 rooms = [앞 요일, 뒤 요일], 연강 rooms = [그 요일]). 실습실이 필요하면 실습실만, 정원이 인원보다 작은 방은 뺀다
const needLab=c=>!!c.f.lab;

const patsFor=(c,k)=>!k.days?shapeKeys(c.f):shapeKeys(c.f).filter(p=>k.days.length>=2?PAT[p].days.every(d=>k.days.includes(d)):PAT[p].days.includes(k.days[0]));
// 교수가 고른 강의실은 희망으로만 쓴다 (roomCost에서 점수). 그 강의실이 겹치면 조건이 맞는 다른 강의실로 자동 배정한다
function strictPairs(c,p){return pairsFor(c,p)}
function clash(cid,p,s,rm){
  const c=C(cid),days=PAT[p].days,mine=occ(p,s);
  if(c.year===1&&mine.some(([d,k])=>d===CHAPEL.day&&k===CHAPEL.slot))return {why:'채플 시간'};
  if(BLOCK){if(BLOCK.room&&rm.includes(BLOCK.room))return {why:'못 쓰는 강의실'};
    if(BLOCK.cells&&mine.some(([d,k])=>BLOCK.cells.has(d+'-'+k)))return {why:'비우기로 한 시간'};}
  for(const o of S.courses){
    if(o.id===cid)continue;const a=S.assign[o.id];if(!a)continue;
    const od=PAT[a.pat].days,theirs=occ(a.pat,a.slot);
    const share=mine.filter(([d,k])=>theirs.some(([e,j])=>e===d&&j===k));if(!share.length)continue;   // 같은 요일·같은 칸이 있을 때만
    if(share.some(([d])=>a.rooms[od.indexOf(d)]===rm[days.indexOf(d)]))return {why:'강의실 겹침',by:o.id};
    if(o.prof&&o.prof===c.prof)return {why:'교수 겹침',by:o.id};
    if(o.year===c.year&&o.req&&c.req)return {why:'같은 학년 전공필수 겹침',by:o.id};
  }
  return null;
}
// 소프트 비용: 칠한 칸 + 희망 자리와의 거리 + 강의실 + 수업 형태
// 희망 자리와의 거리: 시각 차이 + 희망에 없는 요일 하나당 3 + 형태가 다르면 2
function dist(c,p,s){const W=wished(c);if(!W.length)return 0;
  return Math.min(...W.map(w=>Math.abs(w.slot-s)+3*PAT[p].days.filter(d=>!PAT[w.pat].days.includes(d)).length+(PAT[p].n!==PAT[w.pat].n?2:0)));}
function roomCost(c,rm){let v=0;const pr=c.f.pref;
  rm.forEach((r,i)=>{const X=ROOM(r),nl=needLab(c,i);
    if(!nl&&X.lab)v+=3;
    if(pr){if(pr.includes(' ')){const Q=ROOM(pr);if(nl||!Q.lab)v+=r===pr?0:X.bldg===Q.bldg?2.25:3;else v+=X.bldg===Q.bldg?0:1.5}
      else v+=X.bldg===pr?0:1.5}
    v+=ROOMS.indexOf(X)*0.01;});
  return v+(rm.length>1&&rm[0]!==rm[1]?0.3:0);}
const shapeCost=(c,p)=>c.f.shape==='pref'&&!PAT[p].long?2:0;   // 연강 선호인데 주 2회로 두면 비용
function cost(c,p,s,rm){const cc=m=>isWant(m)?0:1;
  return occ(p,s).reduce((v,[d,k])=>v+cc(mk(c.f,d,k)),0)+dist(c,p,s)+roomCost(c,rm)+shapeCost(c,p);}
function genAlts(c,k={}){
  const list=[];
  for(const p of patsFor(c,k))for(const s of (k.win?R(k.win[0],k.win[1]):R(0,SLOTS.length-1))){
    if(!hardOk(c,p,s))continue;
    if(k.endBefore&&PAT[p].days.includes(k.endBefore.day)&&endMin(lastSlot(p,s))>k.endBefore.h*60)continue;
    for(const rm of pairsFor(c,p)){if(clash(c.id,p,s,rm))continue;list.push({pat:p,slot:s,rooms:rm,score:cost(c,p,s,rm)})}}
  list.sort((a,b)=>a.score-b.score||a.slot-b.slot);
  const out=[],seen=new Set();
  for(const a of list){const key=a.pat+a.slot;if(!seen.has(key)){seen.add(key);out.push(a)}if(out.length===3)break}
  for(const a of list){if(out.length>=3)break;if(!out.includes(a))out.push(a)}
  return out.slice(0,3).map((a,i)=>({pat:a.pat,slot:a.slot,rooms:a.rooms,k:'ABC'[i]}));
}
function makeDraft(){
  S.assign={};S.status={};S.blocker={};S.reason={};S.why={};S.conds={};S.moved={};
  const allSpots=c=>shapeKeys(c.f).flatMap(p=>R(0,SLOTS.length-1).filter(s=>fits(p,s)).map(s=>({pat:p,slot:s})));
  const spots=c=>{const W=wished(c);return W.length?W:allSpots(c)};
  const key=c=>(strengthF(c.f)==='꼭'?0:100)+(c.f.lab?0:50)+spots(c).length;
  const order=ACT().sort((a,b)=>key(a)-key(b)||S.courses.indexOf(a)-S.courses.indexOf(b));
  const bumped=[];
  for(const c of order){
    let best=null;
    for(const w of spots(c)){if(!hardOk(c,w.pat,w.slot))continue;
      for(const rm of strictPairs(c,w.pat)){if(clash(c.id,w.pat,w.slot,rm))continue;const sc=cost(c,w.pat,w.slot,rm);
        if(!best||sc<best.sc)best={pat:w.pat,slot:w.slot,rooms:rm,sc};}}
    if(best){S.assign[c.id]={pat:best.pat,slot:best.slot,rooms:best.rooms};S.status[c.id]='done'}else bumped.push(c);
  }
  for(const c of bumped){
    const w=spots(c).filter(x=>hardOk(c,x.pat,x.slot))[0];
    const xs=w?strictPairs(c,w.pat).map(rm=>clash(c.id,w.pat,w.slot,rm)).filter(Boolean):[];   // 어느 강의실이든 걸리는 이유(교수·전공필수)를 먼저 알린다
    const x=xs.find(y=>y.why!=='강의실 겹침')||xs[0]||{why:'자리 없음'};
    const b=x.by?C(x.by):null;
    const pr=!b?'':strengthF(b.f)==='꼭'&&strengthF(c.f)!=='꼭'?"상대 희망에 '꼭' 표시":b.f.lab&&!c.f.lab?'상대 강의가 실습실 필요':'종합 우선순위';
    S.blocker[c.id]=x.by||null;S.why[c.id]={by:x.by||null,why:x.why,pr};
    S.reason[c.id]=b?`${full(b)}(${b.prof} 교수)와 ${x.why} · 우선순위: ${pr}`:x.why;
    const alts=genAlts(c);
    if(alts.length){S.assign[c.id]={pat:alts[0].pat,slot:alts[0].slot,rooms:alts[0].rooms,temp:true};S.status[c.id]='open'}
  }
  S.stage='draft';S.lastChanged=[];
  log('초안',`초안을 자동으로 만들었습니다. 희망대로 ${ACT().length-bumped.length}개, 조율 필요 ${bumped.length}개 (${bumped.map(full).join(', ')}).`);
}
// ---------------- NLP: 조율 메시지 (시안: 틀에 값을 넣어 흉내. 실제는 LLM이 쓰고 코드가 검사) ----------------
function msgText(c,round,alts,b,k){
  const L=[`${c.prof} 교수님, 안녕하세요. 학과사무실입니다.`,`2027-1학기 시간표 ${round}차 조율 안내드립니다.`,''];
  if(round===1)L.push(`희망하신 시간(${wishLabel(c)})이 ${S.reveal&&b?`${b.prof} 교수님의 ${b.name} ${b.sec} 분반과`:'다른 강의와'} 겹칩니다.`);
  else{L.push(Object.keys(k||{}).length?`지난 회신에서 주신 조건(${condLabel(k)})을 반영해 대안을 다시 드립니다.`:'지난 차수 이후 바뀐 시간표를 반영해 대안을 다시 드립니다.');
    L.push(`처음 희망하신 시간: ${wishLabel(c)}`);}
  L.push('');
  alts.forEach(a=>L.push(`${a.k}  ${altLabel(a)}`));
  L.push('','가능한 안을 골라 주시거나, 모두 어려우시면 가능한 시간을 적어 주세요. 회신 기한은 1주이며, 기한 전에 한 번 더 알려 드립니다.');
  return L.join('\n');
}
function sendMsg(cid){
  const c=C(cid),b=S.blocker[cid]?C(S.blocker[cid]):null,alts=genAlts(c,S.conds[cid]||{});
  S.msgs.push({id:'m'+(S.msgs.length+1),cid,round:S.round,alts,blocker:b?b.id:null,text:msgText(c,S.round,alts,b,S.conds[cid]),reply:null,parsed:null,decision:null});
}
function publish(){
  S.stage='round';S.round=1;
  Object.keys(S.status).filter(id=>S.status[id]==='open').forEach(sendMsg);
  log('1차 조율',`초안을 모든 교수에게 공개하고, 밀린 분반 교수 ${openMsgs().length}명에게만 조율 메시지를 보냈습니다.`);
}
function check(m){
  const r=m.parsed,rows=[];
  if(r.kind==='확인 필요')return {rows,action:null,text:'AI가 답장을 확실히 읽지 못했습니다. [수정]으로 직접 정해 주세요.'};
  if(r.picks.length){
    for(const p of r.picks){
      const a=m.alts.find(x=>x.k===p);if(!a){rows.push({k:p,ok:false,why:'없는 안'});continue}
      const eb=r.conds.endBefore;let ok=true,why='고른 안';
      if(eb&&PAT[a.pat].days.includes(eb.day)){const e=lastSlot(a.pat,a.slot);ok=endMin(e)<=eb.h*60;why=`${DAYN[eb.day]}요일 ${endOf(e)} 종료 → ${ok?'조건과 맞음':'조건과 어긋남'}`}
      if(ok&&clash(m.cid,a.pat,a.slot,a.rooms)){ok=false;why='그사이 다른 강의가 들어감'}
      rows.push({k:p,a,ok,why});
    }
    const g=rows.find(x=>x.ok);
    if(g)return {rows,action:{type:'move',k:g.k},text:`${g.k}안으로 옮길까요?`,sub:altLabel(g.a)};
    return S.round<3?{rows,action:{type:'next',conds:r.conds},text:'고른 안이 모두 조건과 어긋납니다. 조건을 넣어 다음 차수 대안을 만들까요?'}
                    :{rows,action:null,text:'3차라 더 묻지 않습니다. [수정]이나 [현재대로 유지]로 정해 주세요.'};
  }
  if(S.round>=3)return {rows,action:null,text:'3차라 더 묻지 않습니다. [수정]이나 [현재대로 유지]로 정해 주세요.'};
  return {rows,action:{type:'next',conds:r.conds},text:Object.keys(r.conds).length?`새 조건(${condLabel(r.conds)})으로 다음 차수 대안을 만들까요?`:'다른 조건 없이 거절했습니다. 다음 차수 대안을 만들까요?'};
}
function receive(m,text,choice,from){m.reply={text,choice:choice||null,from};m.parsed=parseReply(text,choice);m.decision=null}
const sameSpot=(a,b)=>a.pat===b.pat&&a.slot===b.slot&&a.rooms.join()===b.rooms.join();
function resolveRound(){
  const prev=clone(S.assign),next=[],rd=S.round;
  for(const m of openMsgs()){
    const c=C(m.cid),d=m.decision;
    if(!d){next.push(c.id);log(`${rd}차 재배정`,`${full(c)}: 회신 없음 → 다음 차수에 다시 묻기`);continue}
    if(d.action.type==='move'){
      const a=m.alts.find(x=>x.k===d.action.k);
      if(!clash(c.id,a.pat,a.slot,a.rooms)){S.assign[c.id]={pat:a.pat,slot:a.slot,rooms:a.rooms};S.status[c.id]='done'}
      else{next.push(c.id);log(`${rd}차 재배정`,`${full(c)}: ${a.k}안 자리가 찼음 → 다음 차수`)}
    }else if(d.action.type==='keep'){S.assign[c.id].temp=false;S.status[c.id]='done'}
    else{S.conds[c.id]={...(S.conds[c.id]||{}),...d.action.conds};next.push(c.id)}
  }
  S.lastChanged=S.courses.filter(c=>{const a=prev[c.id],b=S.assign[c.id];return a&&b&&!sameSpot(a,b)}).map(c=>c.id);
  log(`${rd}차 재배정`,`확인된 처리안만 반영하고 나머지 배정은 유지했습니다. 바뀐 분반 ${S.lastChanged.length}개${S.lastChanged.length?' ('+S.lastChanged.map(id=>full(C(id))).join(', ')+')':''}.`);
  if(next.length&&S.round<3){S.round++;next.forEach(sendMsg);log(`${S.round}차 조율`,`남은 ${next.length}건에 ${S.round}차 메시지를 보냈습니다.`)}
  else{
    next.forEach(id=>{S.assign[id].temp=false;S.status[id]='done';log('확정',`${full(C(id))}: 3차 후 조교가 결정 (임시 배치 유지)`)});
    S.stage='final';log('확정','남은 겹침이 없어 시간표를 확정했습니다. 엑셀로 내보내 SAP에 입력하면 됩니다.');
  }
}
function violations(){const set=new Set();
  for(const c of ACT()){const a=S.assign[c.id];if(!a)continue;const x=clash(c.id,a.pat,a.slot,a.rooms);
    if(x)set.add(x.by?[c.id,x.by].sort().join():c.id+x.why);if(!hardOk(c,a.pat,a.slot))set.add(c.id+'불가')}
  return set.size}

// ---------------- NLP: AI 도우미 (시안: 키워드 규칙으로 흉내. 실제는 LLM이 의도·정보를 JSON으로 뽑고 솔버 도구를 부름) ----------------
// 줄임말 → 과목 이름. 분반이 여러 개면 그 과목의 분반을 모두 후보로 잡는다
const ALIAS={객프:'객체지향프로그래밍',객체지향:'객체지향프로그래밍',자구:'자료구조',소공:'소프트웨어공학',운체:'운영체제',컴네:'컴퓨터네트워크',네트워크:'컴퓨터네트워크',자연어:'자연언어처리',인공지능:'인공지능',데베:'데이터베이스',디비:'데이터베이스',알고리즘:'알고리즘',기계학습:'기계학습',머신러닝:'기계학습',컴구:'컴퓨터구조',이산:'이산수학'};
function parseCmd(t){
  const q={intent:null,courses:[],prof:null,coref:false,alt:null,pat:null,day:null,slot:null,win:null,room:null,sec:null,raw:t};
  const names=new Set(S.courses.filter(c=>t.includes(c.name)).map(c=>c.name));
  for(const [a,n] of Object.entries(ALIAS))if(t.includes(a))names.add(n);
  for(const c of S.courses)if(names.has(c.name))q.courses.push(c.id);
  const sm=t.match(/(?<![\d:])(0[1-9])(?![\d:])/);if(sm)q.sec=sm[1];   // "02", "02분반" (09:00 같은 시각은 제외)
  if(q.sec&&q.courses.some(id=>C(id).sec===q.sec))q.courses=q.courses.filter(id=>C(id).sec===q.sec);
  const pm=t.match(/([가나다라마바사아자차카])\s*교수/);if(pm)q.prof=pm[1];
  q.coref=/그\s*(강의|수업|과목|분반|거)|그거|아까\s*(그|거|강의)|방금\s*(그|거|강의)/.test(t);
  const am=t.match(/(?<![A-Za-z])([ABC])(?![A-Za-z])/);if(am)q.alt=am[1];
  const pp=t.match(/([월화수목금])(?:요일)?\s*(?:과|와|하고|[·,\/])?\s*([월화수목금])(?!업|정|강|학)/);
  if(pp&&pp[1]!==pp[2])q.pat=patOf(DAYN.indexOf(pp[1]),DAYN.indexOf(pp[2]));
  else{const dm=t.match(/([월화수목금])요일/)||t.match(/(?:^|\s)([월화수목금])(?=\s|$)/);if(dm)q.day=DAYN.indexOf(dm[1])}
  const tm=t.match(/(\d{1,2})(?::(\d{2})|\s*시(\s*반)?)/);if(tm)q.slot=slotOf(hr(+tm[1]),tm[2]?+tm[2]:tm[3]?30:0);
  if(/오전/.test(t))q.win=[0,1];else if(/저녁/.test(t))q.win=[6,6];else if(/오후/.test(t))q.win=[3,5];
  const rm=t.match(/(201|410|210|305|306)/);if(rm)q.room=ROOMS.find(r=>r.id.endsWith(rm[1])).id;
  if(/왜|이유|어째서/.test(t))q.intent='explain';
  else if(q.room&&/(못\s*쓰|공사|막|빼|없으면|안\s*되|닫)/.test(t))q.intent='room';
  else if((q.day!=null||q.pat)&&!q.courses.length&&!q.coref&&!q.prof&&/(비우|빼|막|안\s*되|없애|쉬)/.test(t))q.intent='block';
  else if(/(옮기|옮겨|바꾸|바꿔|이동|넣어|넣으)/.test(t))q.intent=/(면|어때|될까|\?)/.test(t)?'whatif':'move';
  else if(/(뭐|몇|목록|남은|현황|상황|어디|있어|알려)/.test(t))q.intent='status';
  return q;
}
const hasInfo=q=>q.courses.length||q.prof||q.coref||q.alt||q.room||q.slot!=null||q.pat||q.day!=null||q.win||q.sec;
function botRun(text){
  const b=S.bot;b.turns.push({who:'ta',text});
  let q=parseCmd(text);
  if(!q.intent&&b.pending&&hasInfo(q)){const p=b.pending;
    // 되물은 뒤 "02"처럼 분반 번호만 답하면 앞에서 보여 준 후보 중에서 고른다
    if(!q.courses.length&&q.sec&&p.cands)q.courses=p.cands.filter(id=>C(id).sec===q.sec);
    q={...p,courses:q.courses.length?q.courses:p.courses,prof:q.prof||p.prof,coref:q.coref||p.coref,alt:q.alt||p.alt,pat:q.pat||p.pat,
       day:q.day??p.day,slot:q.slot??p.slot,win:q.win||p.win,room:q.room||p.room,raw:p.raw+' → '+text,merged:true};}
  b.pending=null;
  b.turns.push(botAnswer(q));
}
// 지금 시간표에서 바뀐 것만 고치기: 고정한 분반은 두고, 규칙에 걸리는 분반만 가장 가까운 대안으로 옮긴다
function repair(fixed){
  for(let it=0;it<8;it++){let moved=false;
    for(const o of ACT()){
      if(fixed.has(o.id))continue;const a=S.assign[o.id];if(!a)continue;
      if(!clash(o.id,a.pat,a.slot,a.rooms)&&hardOk(o,a.pat,a.slot))continue;
      const alts=genAlts(o,S.conds[o.id]||{});if(!alts.length){FAIL=o.id;return false}
      S.assign[o.id]={pat:alts[0].pat,slot:alts[0].slot,rooms:alts[0].rooms,temp:a.temp};fixed.add(o.id);moved=true;}
    if(!moved)return true;}
  return false;
}
function sim(fn){
  const base=clone(S.assign);FAIL=null;let ok=false,after;
  try{ok=fn()}finally{after=clone(S.assign);S.assign=base;BLOCK=null}
  const changes=ACT().filter(c=>base[c.id]&&after[c.id]&&!sameSpot(base[c.id],after[c.id])).map(c=>({cid:c.id,from:base[c.id],to:after[c.id]}));
  S.assign=after;const v=violations();S.assign=base;
  return {ok,after,changes,v};
}
function bestRooms(c,p,s,want){let ps=pairsFor(c,p);if(want)ps=ps.filter(rm=>rm.includes(want));if(!ps.length)return null;
  const free=ps.filter(rm=>!clash(c.id,p,s,rm)),pool=free.length?free:ps;
  return pool.slice().sort((x,y)=>cost(c,p,s,x)-cost(c,p,s,y))[0];}
function explainText(c){
  const a=S.assign[c.id];if(!a)return `${jo(full(c),'은','는')} 아직 배정 전입니다.`;

  if(w){const b=w.by?C(w.by):null,first=`희망하신 ${wishLabel(c)}`;
    const HIT={'강의실 겹침':'강의실이 겹쳤습니다','교수 겹침':'담당 교수가 같아 시간이 겹쳤습니다','같은 학년 전공필수 겹침':'같은 학년 전공필수라 시간이 겹쳤습니다'};
    const hit=b?`${full(b)}(${b.prof} 교수)와 ${HIT[w.why]||w.why}`:`${w.why} 때문에 자리가 없었습니다`;
    if(S.status[c.id]==='open')return `${full(c)}: ${jo(first,'이','가')} ${hit}. 우선순위(${w.pr})에 따라 이 강의가 밀렸고, 지금은 ${here}에 임시로 두고 ${S.stage==='round'?S.round+'차 조율 중':'조율을 기다리는 중'}입니다.`;
    return `${full(c)}: ${jo(first,'이','가')} ${hit}. 조율을 거쳐 지금 자리(${here})로 정했습니다.`;}
  const notes=[];
  if(c.f.pref&&c.f.pref.includes(' ')&&a.rooms.includes(c.f.pref))notes.push('희망 강의실도 그대로입니다');
  return `${jo(full(c),'은','는')} ${c.prof} 교수님이 칠한 희망 시간(${wishText(c.f,false)}) 안에서 규칙에 걸리지 않는 자리라 ${here}에 배정했습니다.${notes.length?' '+notes.join(', ')+'.':''}`;
}
function statusText(c,prof){
  const spot=x=>{const a=S.assign[x.id];return a?`${altLabel(a)}${S.status[x.id]==='open'?' (조율 중, 임시)':''}`:'배정 전'};
  if(c)return `${jo(full(c),'은','는')} 지금 ${spot(c)}입니다.`;
  if(prof){const cs=ACT().filter(x=>x.prof===prof);return cs.length?`${prof} 교수님 강의는 ${cs.length}개입니다. `+cs.map(x=>`${full(x)}: ${spot(x)}`).join(' / '):`${prof} 교수님이 맡은 강의가 없습니다.`}
  if(S.stage==='collect')return `희망 수집 중입니다. 기타 요청 확인 ${etcTodo()}건이 남았습니다.`;
  const open=ACT().filter(x=>S.status[x.id]==='open');
  return `조율 중인 분반은 ${open.length}개${open.length?` (${open.map(x=>`${full(x)} · ${x.prof} 교수`).join(', ')})`:''}이고, 하드 규칙 위반은 ${violations()}건입니다.`+(S.stage==='round'?` ${S.round}차 회신 대기 ${openMsgs().filter(m=>!m.reply).length}건.`:'');
}
function withPreview(T,r,lead,target,raw){
  T.solver=r.ok?`바뀌는 분반 ${r.changes.length}개 · 하드 규칙 위반 ${r.v}건`:'계산 실패';
  if(!r.ok){T.text=FAIL?`${lead} ${jo(full(C(FAIL)),'을','를')} 둘 다른 자리가 없어서 할 수 없습니다.`:`${lead} 규칙을 지키는 배치를 찾지 못했습니다.`;return T}
  if(!r.changes.length){T.text=`${lead} 바뀌는 분반이 없습니다.`;return T}
  const miss=r.changes.filter(x=>!wishOkAt(C(x.cid),x.to.pat,x.to.slot));
  const notice=r.changes.filter(x=>x.cid!==target&&S.status[x.cid]==='done');
  T.text=`${lead} ${r.changes.length}개 분반이 바뀌고 하드 규칙 위반은 ${r.v}건입니다. `
    +(miss.length?`희망 시간 밖으로 가는 분반은 ${miss.length}개(${miss.map(x=>full(C(x.cid))).join(', ')})입니다.`:'바뀌는 분반은 모두 교수님 희망 시간 안입니다.')
    +(notice.length?` ${notice.map(x=>`${full(C(x.cid))}(${C(x.cid).prof} 교수)`).join(', ')}는 이미 정해진 강의라, 적용하면 교수님께 변경 안내가 필요합니다.`:'');
  T.preview={changes:r.changes,after:r.after,base:JSON.stringify(S.assign),state:null,target,raw};
  return T;
}
function botAnswer(q){
  const IN={explain:'이유 설명',room:'가정 실행',block:'가정 실행',whatif:'가정 실행',move:'이동',status:'현황 조회'};
  const T={who:'bot',intent:q.intent?IN[q.intent]:'범위 밖',info:{},tool:null,solver:null,text:''};
  if(!q.intent){
    if(hasInfo(q)){T.intent='확인 필요';T.text='무엇을 할지 알려 주세요. 예: "왜 여기야?", "B안으로 옮겨", "화·목 10:30으로 옮기면?"';S.bot.pending=q;return T}
    T.text='시간표 편성·조율과 관련된 요청만 처리합니다. 예: "객체지향은 왜 밀렸어?", "화요일 오전 비우면?"';return T}
  let ids=q.courses.slice();
  if(!ids.length&&q.coref&&S.bot.last){ids=[S.bot.last];T.info['그 강의']=full(C(S.bot.last))}
  if(!ids.length&&q.prof){ids=S.courses.filter(c=>c.prof===q.prof).map(c=>c.id);T.info.교수=q.prof+' 교수'}
  // "왜 밀렸어?"처럼 이유를 물을 때 후보 중 조율 중인 분반이 하나뿐이면 그 분반으로 본다
  if(q.intent==='explain'&&ids.length>1){const op=ids.filter(id=>S.status[id]==='open');if(op.length===1)ids=op}
  if(['explain','whatif','move'].includes(q.intent)&&ids.length!==1){
    T.ask=true;S.bot.pending={...q,courses:[],prof:null,coref:false,sec:null,cands:ids.length>1?ids:null};
    const sameName=ids.length>1&&ids.every(id=>C(id).name===C(ids[0]).name);
    T.text=ids.length>1?`${q.prof?q.prof+' 교수님 강의가':'해당하는 강의가'} ${ids.length}개입니다: ${ids.map(id=>full(C(id))).join(', ')}. ${sameName?'몇 분반인가요? 예: "02"':'어느 강의인가요?'}`:'어느 강의인가요? 과목 이름으로 알려 주세요.';
    return T}
  if(q.intent==='status'&&!q.courses.length&&!T.info['그 강의']&&q.prof){
    T.tool=`status(교수="${q.prof}")`;T.solver='현재 시간표 조회';T.text=statusText(null,q.prof);return T}
  const c=ids.length===1?C(ids[0]):null;
  if(c){if(!T.info['그 강의'])T.info.분반=full(c);S.bot.last=c.id}
  if(q.intent==='status'){
    T.tool=c?`status(분반="${full(c)}")`:'status()';T.solver='현재 시간표 조회';
    T.text=statusText(c,null);return T}
  if(S.stage==='collect'){T.text='아직 초안이 없습니다. 희망 확인을 마치고 초안을 만든 뒤에 계산할 수 있습니다.';return T}
  if(c&&c.own!=='ok'){T.text=`${jo(full(c),'은','는')} 담당 교수가 정해지지 않아 배정 전입니다.`;return T}
  if(q.intent==='explain'){T.tool=`explain(분반="${full(c)}")`;T.solver='배정 기록 조회';T.text=explainText(c);return T}
  if(q.intent==='whatif'||q.intent==='move'){
    const cur=S.assign[c.id];let tgt=null;
    if(q.alt){const m=S.msgs.filter(x=>x.cid===c.id).slice(-1)[0],alts=m?m.alts:genAlts(c,S.conds[c.id]||{}),a=alts.find(x=>x.k===q.alt);
      T.info.대안=q.alt+'안';if(!a){T.text=`${full(c)}에는 ${q.alt}안이 없습니다.`;return T}tgt={pat:a.pat,slot:a.slot,rooms:a.rooms}}
    else if(q.slot!=null||q.pat||q.day!=null||q.room||q.win){
      const shapes=shapeKeys(c.f);
      if(q.pat&&!shapes.includes(q.pat)){T.solver='거부: 수업 형태';T.text=`${jo(full(c),'은','는')} 주 1회 연강으로만 받았습니다. 요일 하나로 알려 주세요. 예: "수요일 13:30"`;return T}
      if(q.day!=null&&!q.pat&&!PAT[cur.pat].days.includes(q.day)&&!shapes.includes('L'+q.day)){T.ask=true;S.bot.pending={...q,courses:[c.id],day:null};
        T.text=`수업이 주 2회라 요일이 두 개 필요합니다. ${DAYN[q.day]}요일과 어느 요일로 할까요? 예: "${PAT[patOf(q.day,q.day===4?1:4)].label}"`;return T}
      const pat=q.pat||(q.day!=null&&(PAT[cur.pat].long||!PAT[cur.pat].days.includes(q.day))&&shapes.includes('L'+q.day)?'L'+q.day:cur.pat);
      tgt={pat,slot:q.slot??(q.win?q.win[0]:cur.slot),room:q.room}}
    if(!tgt){T.ask=true;S.bot.pending={...q,courses:[c.id]};T.text=`${jo(full(c),'을','를')} 어디로 옮길까요? 예: "화·목 10:30", "B안"`;return T}
    const lbl=`${PAT[tgt.pat].label} ${SLOTS[tgt.slot]}${tgt.room?' · '+tgt.room:''}`;T.info.목표=lbl;
    T.tool=`move(분반="${full(c)}", 요일="${PAT[tgt.pat].label}", 시작="${SLOTS[tgt.slot]}"${tgt.room?`, 강의실="${tgt.room}"`:''})`;
    if(!fits(tgt.pat,tgt.slot)){T.solver='거부: 시간 넘침';T.text=`연강은 ${SLOTS[SLOTS.length-2]} 시작이 마지막입니다.`;return T}
    if(!hardOk(c,tgt.pat,tgt.slot)){T.solver='거부: 교수 불가 시간';T.text=`${PAT[tgt.pat].label} ${SLOTS[tgt.slot]}은 ${c.prof} 교수님이 불가로 칠한 시간이라 옮길 수 없습니다.`;return T}
    if(c.year===1&&occ(tgt.pat,tgt.slot).some(([d,k])=>d===CHAPEL.day&&k===CHAPEL.slot)){T.solver='거부: 채플 시간';T.text='1학년 채플 시간(목 12:00)이라 옮길 수 없습니다.';return T}
    const rm=tgt.rooms||bestRooms(c,tgt.pat,tgt.slot,tgt.room);
    if(!rm){T.solver='거부: 강의실 조건';T.text=`${jo(tgt.room,'은','는')} ${c.f.lab?'실습실이 아니거나 ':''}정원이 인원(${c.f.size}명)보다 작아 ${full(c)}을(를) 둘 수 없습니다.`;return T}
    const r=sim(()=>{S.assign[c.id]={pat:tgt.pat,slot:tgt.slot,rooms:rm,temp:false};return repair(new Set([c.id]))});
    const to=r.after[c.id];
    return withPreview(T,r,`${jo(full(c),'을','를')} ${q.alt?`${q.alt}안(${altLabel(to)})으로`:ro(altLabel(to))} 옮기면`,c.id,q.raw);
  }
  if(q.intent==='block'){
    const days=q.pat?PAT[q.pat].days:[q.day],ss=q.slot!=null?[q.slot]:q.win?R(q.win[0],q.win[1]):R(0,SLOTS.length-1);
    const lbl=`${days.map(d=>DAYN[d]).join('·')}요일 ${ss.length===SLOTS.length?'전체':ss.length===1?SLOTS[ss[0]]:SLOTS[ss[0]]+'~'+endOf(ss[ss.length-1])}`;
    T.info['비울 시간']=lbl;T.tool=`what_if(비울 시간="${lbl}")`;
    const r=sim(()=>{BLOCK={cells:new Set(days.flatMap(d=>ss.map(s=>d+'-'+s)))};return repair(new Set())});
    return withPreview(T,r,`${jo(lbl,'을','를')} 비우면`,null,q.raw);
  }
  if(q.intent==='room'){
    T.info.강의실=q.room;T.tool=`what_if(못 쓰는 강의실="${q.room}")`;
    const r=sim(()=>{BLOCK={room:q.room};return repair(new Set())});
    return withPreview(T,r,`${jo(q.room,'을','를')} 못 쓰면`,null,q.raw);
  }
  return T;
}

// 아직 적용하지 않은 가장 최근 AI 도우미 미리보기 (패널이 열려 있고 시간표가 그대로일 때만)
function livePreview(){
  if(S.role!=='ta'||!S.botOpen)return null;
  for(let i=S.bot.turns.length-1;i>=0;i--){const p=S.bot.turns[i].preview;if(p)return !p.state&&p.base===JSON.stringify(S.assign)?p:null}
  return null;
}
function grid(opt={}){
  const pv=livePreview(),moving=new Set(pv?pv.changes.map(x=>x.cid):[]);
  const head=`<div></div>${D5.map(d=>`<div class="h">${DAYN[d]}</div>`).join('')}`;
  let body='';
  SLOTS.forEach((s,i)=>{
    body+=`<div class="t">${s}<br><span>~${endOf(i)}</span></div>`;
    for(const d of D5){
      const blks=S.courses.map(c=>{const a=S.assign[c.id];if(!a)return '';const k=PAT[a.pat].days.indexOf(d);if(k<0||i<a.slot||i>lastSlot(a.pat,a.slot))return '';
        const room=a.rooms[k];if(S.room!=='all'&&room!==S.room)return '';
        const cls=[a.temp?'temp':'',S.lastChanged.includes(c.id)?'changed':'',moving.has(c.id)?'leave':'',opt.prof?(c.prof===opt.prof?'mine':'dim'):''].join(' ');
        return `<div class="blk ${cls}"><b>${E(full(c))}</b>${E(room)}<br><span class="muted">${E(c.prof)} 교수 · ${c.year}학년${c.req?' 전필':''}${PAT[a.pat].long?(i>a.slot?' · 연강 (이어서)':' · 연강'):''}${a.temp?' · 조율 중':''}${moving.has(c.id)?' · 옮겨질 자리':''}</span></div>`}).join('');
      const ghosts=pv?pv.changes.map(x=>{const k=PAT[x.to.pat].days.indexOf(d);if(k<0||i<x.to.slot||i>lastSlot(x.to.pat,x.to.slot))return '';const room=x.to.rooms[k];if(S.room!=='all'&&room!==S.room)return '';
        return `<div class="blk ghost"><b>→ ${E(full(C(x.cid)))}</b>${E(room)}<br><span>AI 도우미 미리보기</span></div>`}).join(''):'';
      body+=`<div class="cell">${blks}${ghosts}</div>`;
    }
  });
  const filt=`<div class="row" style="margin-bottom:10px"><label class="small muted" for="roomsel">강의실</label><select id="roomsel" data-chg="room"><option value="all">전체</option>${ROOMS.map(r=>`<option ${S.room===r.id?'selected':''}>${r.id}</option>`).join('')}</select>
    <span class="chip warn">조율 중(임시 배치)</span>${S.lastChanged.length?'<span class="chip good">방금 바뀜</span>':''}${opt.prof?'<span class="chip accent">내 강의</span>':''}${pv?'<span class="chip accent">점선 = AI 도우미 미리보기 (적용 전)</span>':''}</div>`;
  return filt+`<div class="ttwrap"><div class="tt">${head}${body}</div></div>`;
}

  const side=open.map(c=>{const m=S.msgs.filter(x=>x.cid===c.id).slice(-1)[0];const alts=m?m.alts:genAlts(c,S.conds[c.id]||{});

function msgChecks(m){

function decisionBox(m){
  if(!m.reply)return `<div class="note">회신 대기 중 · 기한 1주, 기한 전 자동 재알림</div>`;
  const ck=check(m),ch=m.reply.choice,pick=ch?(ch==='none'?'모두 어려움':ch+'안'):'';
  const said=m.reply.text?`"${E(m.reply.text)}"${pick?` <span class="muted small">(${pick} 선택)</span>`:''}`:pick+' 선택';
  // 고른 안이 조건에 걸려 빠졌을 때만 이유를 한 줄로 알린다
  const drop=ck.rows.filter(x=>!x.ok).map(x=>x.why.includes('→')?`${x.k}안은 ${x.why.split(' → ')[0]}라 조건과 맞지 않습니다.`:`${x.k}안: ${x.why}`);
  let h=`<div class="lbl">교수님 답장</div><div class="msg">${said}</div>
   <div class="prop"><div class="big">${E(ck.text)}</div>${ck.sub?`<div class="small muted">${E(ck.sub)}</div>`:''}${drop.map(t=>`<div class="small" style="margin-top:4px">${E(t)}</div>`).join('')}`;
  if(m.decision){
    const d=m.decision,what=d.action.type==='move'?`${d.action.k}안으로 이동`:d.action.type==='keep'?'현재 배치 유지':'다음 차수에 다시 묻기';
    h+=`<div class="decided">${E(d.kind)} · ${E(what)}${d.reason?` · 사유: ${E(d.reason)}`:''} <button class="btn small" data-act="undo" data-m="${m.id}" style="margin-left:6px">되돌리기</button></div></div>`;
    return h;
  }
  const ed=S.editing&&S.editing.m===m.id?S.editing.mode:null;
  h+=`<div class="row" style="margin-top:10px"><button class="btn primary small" data-act="confirm" data-m="${m.id}" ${ck.action?'':'disabled'}>확인</button>
     <button class="btn small" data-act="edit" data-m="${m.id}">수정</button><button class="btn small" data-act="keep" data-m="${m.id}">현재대로 유지</button></div>`;
  if(ed){
    h+=`<div style="margin-top:10px">${ed==='edit'?`<div class="lbl">어떻게 처리할까요?</div><select id="ed-sel">${m.alts.map(a=>`<option value="${a.k}">${a.k}안 · ${E(altLabel(a))}</option>`).join('')}${S.round<3?'<option value="next">다음 차수에 다시 묻기</option>':''}</select>`:''}
      <div class="lbl">사유 (필수, 기록에 남음)</div><input type="text" id="ed-why" placeholder="${ed==='edit'?'예: 교수님과 통화로 B안 확인':'예: 교수님이 임시 배치도 괜찮다고 하심'}">
      <div class="row" style="margin-top:8px"><button class="btn primary small" data-act="save" data-m="${m.id}">저장</button><button class="btn small" data-act="cancel">취소</button></div></div>`;
  }
  return h+'</div>';
}

      <div class="row" style="gap:14px;align-items:flex-end;margin-top:4px">
        <div><div class="lbl">인원</div><select data-chg="fsize" data-c="${c.id}" ${dis} aria-label="인원">${SIZES.map(n=>`<option value="${n}" ${x.f.size===n?'selected':''}>${n}명</option>`).join('')}</select></div>
        <div><div class="lbl">실습실</div><select data-chg="flab" data-c="${c.id}" ${dis} aria-label="실습실"><option value="0" ${x.f.lab?'':'selected'}>필요 없음</option><option value="1" ${x.f.lab?'selected':''}>필요</option></select></div></div>
      <div class="lbl">주 1회 연강 <span class="muted small">(2시간 반을 하루에 한 번에. 원하시면 그 요일의 이어진 두 칸을 희망으로 칠해 주세요)</span></div><select data-chg="fshape" data-c="${c.id}" ${dis} aria-label="주 1회 연강">${Object.entries(SHAPEN).map(([k,v])=>`<option value="${k}" ${(x.f.shape||'none')===k?'selected':''}>${v}</option>`).join('')}</select>
      <div class="lbl">건물 선호</div><select data-chg="fpref" data-c="${c.id}" ${dis} aria-label="건물 선호">${prefOpts(x.f)}</select>
      <div class="lbl">강의실 <span class="muted small">(선택. 안 고르면 실습실 여부와 인원에 맞춰 자동으로 정합니다)</span></div><select data-chg="froom" data-c="${c.id}" ${dis} aria-label="강의실">${roomOpts(x.f)}</select>
      <div class="lbl">기타 요청 <span class="muted small">(위 칸으로 정할 수 없는 것만)</span></div><textarea data-inp="fetc" data-c="${c.id}" ${dis} placeholder="예: 학기 중 두 번 대강이 필요합니다. 학과사무실에서 직접 확인합니다.">${E(x.f.etc)}</textarea>
      <div class="lbl">접수 내용</div><div data-sum="${c.id}">${fChips(x.f,S.prof)}</div>
    </div></div></div>`).join('')}`;
}
function vPTable(){
  if(S.stage==='collect'||S.stage==='draft')return `<h1>공개 시간표</h1><div class="card">조교가 초안을 확인하고 있습니다. 공개되면 여기서 볼 수 있습니다.</div>`;
  return `<h1>공개 시간표</h1><p class="lead">모든 교수님께 같은 시간표가 공개됩니다.</p><div class="card">${grid({prof:S.prof})}</div>`;
}
function vPMsg(){
  const ms=S.msgs.filter(m=>C(m.cid).prof===S.prof);
  if(!ms.length)return `<h1>조율 메시지</h1><div class="card">받은 조율 메시지가 없습니다. ${S.stage==='round'||S.stage==='final'?'희망하신 대로 배정되었습니다.':''}</div>`;
  return `<h1>조율 메시지</h1><p class="lead">${S.prof} 교수님께 온 메시지입니다.</p>`+ms.slice().reverse().map(m=>{
    const live=S.stage==='round'&&m.round===S.round&&!m.reply;
    return `<form class="card" data-form="reply" data-m="${m.id}"><div class="row" style="justify-content:space-between"><b>${m.round}차 조율 · ${E(full(C(m.cid)))}</b>${m.reply?chip('답장함','good'):live?chip('답장 필요','warn'):chip('지난 차수')}</div>
      <div class="msg" style="margin-top:10px">${E(m.text)}</div>
      ${live?`<div class="lbl">안 고르기</div>${m.alts.map(a=>`<label class="alt"><input type="radio" name="ch" value="${a.k}"><span class="k">${a.k}</span>${E(altLabel(a))}</label>`).join('')}
        <label class="alt"><input type="radio" name="ch" value="none"><span class="k" style="background:var(--muted)">–</span>모두 어려움</label>
        <div class="lbl">하실 말씀 (선택)</div><textarea name="text" placeholder="예: A나 B 괜찮아요. 수요일은 17시 전에 끝나야 해요."></textarea>
        <div class="row" style="margin-top:10px"><button class="btn primary" type="submit">보내기</button>${SCRIPT[m.round]&&SCRIPT[m.round][m.cid]?`<button class="btn small" type="button" data-act="example" data-m="${m.id}">예시 답장 넣기</button>`:''}</div>`
      :m.reply?`<div class="note" style="margin-top:10px">보낸 답장: ${m.reply.choice?(m.reply.choice==='none'?'모두 어려움':m.reply.choice+'안')+' · ':''}${E(m.reply.text||'')} · 조교 확인 후 반영됩니다.</div>`:''}
    </form>`}).join('');
}

function render(){
  const items=navItems(); if(!items.some(i=>i[0]===S.view))S.view=items[0][0];
  const V={home:vHome,wishes:vWishes,draft:vDraft,coord:vCoord,final:vFinal,settings:vSettings,pwish:vPWish,ptable:vPTable,pmsg:vPMsg}[S.view];
  document.getElementById('app').innerHTML=`
  <div class="top"><div class="wrap"><div class="logo">SSU<b>:</b>room</div><span class="sub">강의시간표 편성·조율 도우미 · 시안 v4</span><span class="virt">가상 데이터</span><div class="spacer"></div>
    <div class="seg"><button class="${S.role==='ta'?'on':''}" data-act="role" data-v="ta">조교</button><button class="${S.role==='prof'?'on':''}" data-act="role" data-v="prof">교수</button></div>
    ${S.role==='prof'?`<select data-chg="prof" aria-label="교수 고르기">${PROFS.map(p=>`<option value="${p}" ${p===S.prof?'selected':''}>${p} 교수</option>`).join('')}</select>`:''}</div></div>
  <div class="wrap">${stepsBar()}<div class="main"><nav>${items.map(([k,t,n])=>`<button class="${S.view===k?'on':''}" data-act="go" data-v="${k}"><span>${t}</span>${n?`<span class="badge">${n}</span>`:''}</button>`).join('')}</nav>
  <main>${V()}</main></div></div>
  ${S.role!=='ta'?'':S.botOpen?botPanel():`<button class="botfab${S.botSeen?'':' new'}" data-act="botOpen" aria-label="AI 도우미 열기"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></span><span><b>AI 도우미</b><small>시간표를 말로 물어보기</small></span></button>`}`;
  const app=document.getElementById('app');app.className=S.role==='ta'&&S.botOpen?'botopen':'';
  if(S.role==='ta'&&S.botOpen){const ch=document.getElementById('chat');if(ch)ch.scrollTop=ch.scrollHeight;if(S.botFocus){const i=document.getElementById('botq');if(i)i.focus()}}
  S.botFocus=false;
}

// ---------------- 시간 칠하기 ----------------
let PAINT=null;
function setMark(x,d,k,mark){const key=d+'-'+k;if(mark)x.f.paint[key]=mark;else delete x.f.paint[key];
  const e=document.querySelector(`[data-paint="${x.cid}"][data-d="${d}"][data-s="${k}"]`);
  if(e){e.className='pc '+mcls(mark);e.textContent=mark||'';e.setAttribute('aria-label',`${DAYN[d]} ${SLOTS[k]} ${mark||'가능'}`)}}
function paintCell(el){const x=claimOf(el.dataset.paint,S.prof);if(!x)return;setMark(x,+el.dataset.d,+el.dataset.s,PAINT.mark);PAINT.dirty=true}
function startPaint(el){const x=claimOf(el.dataset.paint,S.prof);if(!x)return false;const cur=mk(x.f,+el.dataset.d,+el.dataset.s);
  PAINT={cid:el.dataset.paint,mark:CYC[(CYC.indexOf(cur)+1)%CYC.length],dirty:false,last:el};paintCell(el);return true}
function endPaint(){if(!PAINT)return;const p=PAINT;PAINT=null;if(p.dirty)render()}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-paint]');if(!el||el.disabled)return;e.preventDefault();startPaint(el)});
document.addEventListener('pointermove',e=>{if(!PAINT)return;const hit=document.elementFromPoint(e.clientX,e.clientY);const el=hit&&hit.closest('[data-paint]');
  if(!el||el===PAINT.last||el.dataset.paint!==PAINT.cid||el.disabled)return;PAINT.last=el;paintCell(el)});
document.addEventListener('pointerup',endPaint);
document.addEventListener('pointercancel',endPaint);

// ---------------- 이벤트 ----------------
document.addEventListener('click',e=>{
  const pe=e.target.closest('[data-paint]');
  if(pe){if(e.detail===0&&!pe.disabled&&startPaint(pe))endPaint();return}   // 키보드로 누른 경우
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,m=t.dataset.m?S.msgs.find(x=>x.id===t.dataset.m):null;
  if(a==='role'){S.role=t.dataset.v;S.view=S.role==='ta'?'home':'pwish'}
  else if(a==='go')S.view=t.dataset.v;
  else if(a==='etcOk'){const c=C(t.dataset.c);c.f.etcOk=true;log('희망 수집',`${full(c)}: 기타 요청 "${c.f.etc}"을(를) 조교가 확인했습니다.`)}
  else if(a==='etcUndo'){C(t.dataset.c).f.etcOk=false}
  else if(a==='draft'){makeDraft();S.view='draft'}
  else if(a==='publish'){publish();S.view='coord'}
  else if(a==='fake'){openMsgs().filter(x=>!x.reply).forEach(x=>receive(x,(SCRIPT[S.round]||{})[x.cid]||'A로 할게요.',null,'가상 회신'))}
  else if(a==='confirm'){m.decision={kind:'확인',action:check(m).action};S.editing=null}
  else if(a==='edit'||a==='keep'){S.editing={m:m.id,mode:a}}
  else if(a==='cancel')S.editing=null;
  else if(a==='save'){
    const why=(document.getElementById('ed-why').value||'').trim();if(!why){document.getElementById('ed-why').focus();return}
    if(S.editing.mode==='keep')m.decision={kind:'현재대로 유지',action:{type:'keep'},reason:why};
    else{const v=document.getElementById('ed-sel').value;m.decision={kind:'수정',action:v==='next'?{type:'next',conds:m.parsed?m.parsed.conds:{}}:{type:'move',k:v},reason:why}}
    log(`${S.round}차 조율`,`${full(C(m.cid))}: 조교 ${m.decision.kind} · 사유 "${why}"`);S.editing=null;
  }
  else if(a==='undo')m.decision=null;
  else if(a==='resolve'){resolveRound();S.view=S.stage==='final'?'final':'coord'}
  else if(a==='botOpen'){S.botOpen=true;S.botSeen=true;S.botFocus=true}
  else if(a==='botClose'){S.botOpen=false}
  else if(a==='botEx'){botRun(t.dataset.v);S.botFocus=true}
  else if(a==='botApply'){const tn=S.bot.turns[+t.dataset.i],p=tn.preview;
    if(JSON.stringify(S.assign)!==p.base){p.state='stale'}
    else{S.assign=clone(p.after);
      for(const ch of p.changes){const id=ch.cid;S.assign[id].temp=false;S.moved[id]=`요청 "${p.raw}"`;
        if(S.status[id]==='open'){S.status[id]='done';openMsgs().filter(x=>x.cid===id&&!x.decision).forEach(x=>x.decision={kind:'AI 도우미로 옮김',action:{type:'keep'},reason:p.raw})}}
      S.lastChanged=p.changes.map(x=>x.cid);p.state='applied';
      log('AI 도우미',`"${p.raw}" 적용 · 바뀐 분반 ${p.changes.length}개 (${p.changes.map(x=>full(C(x.cid))).join(', ')}).`)}}
  else if(a==='botCancel'){S.bot.turns[+t.dataset.i].preview.state='cancel'}
  else if(a==='csv'){exportCsv();return}
  else if(a==='reset'){S=init();sync()}
  else if(a==='example'){const f=t.closest('form');f.querySelector('textarea[name=text]').value=SCRIPT[m.round][m.cid];return}
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.botOpen&&S.role==='ta'){S.botOpen=false;render();const f=document.querySelector('.botfab');if(f)f.focus()}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.chg;if(!k)return;
  const x=e.target.dataset.c?claimOf(e.target.dataset.c,S.prof):null;
  if(k==='room')S.room=e.target.value;
  if(k==='prof'){S.prof=e.target.value}
  if(k==='fmust'&&x)x.f.must=e.target.checked;
  if(k==='fshape'&&x)x.f.shape=e.target.value;
  if(k==='flab'&&x){x.f.lab=e.target.value==='1';fixRoom(x.f)}
  if(k==='fsize'&&x){x.f.size=+e.target.value;fixRoom(x.f)}
  if(k==='fpref'&&x){x.f.bldg=e.target.value||null;fixRoom(x.f)}
  if(k==='froom'&&x){x.f.room=e.target.value||null;fixRoom(x.f)}
  if(k==='reveal'){S.reveal=e.target.checked;log('설정',`상대 교수 이름 알리기: ${S.reveal?'켬':'끔'}`)}
  render();
});
document.addEventListener('input',e=>{
  if(e.target.dataset.inp!=='fetc')return;const x=claimOf(e.target.dataset.c,S.prof);if(!x)return;
  x.f.etc=e.target.value;x.f.etcOk=false;const sum=document.querySelector(`[data-sum="${x.cid}"]`);if(sum)sum.innerHTML=fChips(x.f,S.prof);
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.form==='bot'){const v=f.q.value.trim();if(!v){f.q.focus();return}botRun(v);S.botFocus=true}
  if(f.dataset.form==='reply'){const m=S.msgs.find(x=>x.id===f.dataset.m),ch=f.querySelector('input[name=ch]:checked'),txt=f.text.value.trim();
    if(!ch&&!txt){f.text.focus();return}
    receive(m,txt,ch?ch.value:null,`${C(m.cid).prof} 교수님`);log(`${m.round}차 조율`,`${full(C(m.cid))}: ${C(m.cid).prof} 교수님 답장 도착`)}
  render();
});
render();
</script>
</body>
</html>
