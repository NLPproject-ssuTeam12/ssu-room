<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSU:room 시연 v4</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 11/15 시안 v4: 희망은 선택칸(시간 칠하기 등)으로 받고, NLP는 조율 회신 해석 · 조율 메시지 · AI 도우미에 쓴다
   11/23: v3의 장점을 더함 — API 명세 모양(19:30 교시, day_slots·end_before 조건, ReplyParse·Proposal, method·fallback),
   메시지 미리 보기 후 보내기와 check_message, 적용·확인 전 확인창(도우미 적용은 사유 필수), 테마 버튼, 인쇄 화면,
   교양필수 시간 막기, 월·수/화·목 묶어 칠하기, 키보드·화면 읽기 지원(포커스 유지, 알림)
   11/23 2차: 진행 바(희망 수집 ── 초안 ── 조율 중 ── 확정), 덜 AI 같은 색, 기타 요청 먼저 보기, 어디서나 '현재 시간표' 서랍과
   대안 미리 보기, 회신 도착 알림(메뉴 숫자), 최종 시간표 확정 요청 → 교수 [확정] 회신 → 내보내기, 교수 '내 강의만' 보기 */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#EDEFF2; --line:#D8DCE1; --ink:#1F2328; --muted:#5E6670;
  --accent:#2F4A73; --accent-soft:#E5EAF1; --accent-ink:#FFFFFF;
  --good:#2F6B47; --good-soft:#E2EEE6; --warn:#875A12; --warn-soft:#F4ECDC; --bad:#A33A32; --bad-soft:#F5E2E0;
  --lab:#5A4C86; --lab-soft:#ECE9F3;
  --font:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181B; --surface:#1E2125; --sunk:#191B1F; --line:#32363C; --ink:#E5E7EA; --muted:#9AA1AA;
  --accent:#93ABD3; --accent-soft:#232B38; --accent-ink:#10151C;
  --good:#7FB894; --good-soft:#1B2A21; --warn:#D6AC64; --warn-soft:#2D2414; --bad:#E38B82; --bad-soft:#341E1C;
  --lab:#B2A6DC; --lab-soft:#262236; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181B; --surface:#1E2125; --sunk:#191B1F; --line:#32363C; --ink:#E5E7EA; --muted:#9AA1AA;
  --accent:#93ABD3; --accent-soft:#232B38; --accent-ink:#10151C;
  --good:#7FB894; --good-soft:#1B2A21; --warn:#D6AC64; --warn-soft:#2D2414; --bad:#E38B82; --bad-soft:#341E1C;
  --lab:#B2A6DC; --lab-soft:#262236; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
/* 상단 바 */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}.logo b{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.virt{font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 8px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:5px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
select{max-width:100%}
textarea{width:100%;resize:vertical;min-height:58px}
input[type=text]{width:100%}
/* 단계 바: 희망 수집 ── 초안 ── 조율 중 ── 확정 */
.steps{display:flex;align-items:center;list-style:none;margin:0;padding:16px 2px 8px;overflow-x:auto}
.steps li{display:flex;align-items:center;flex:1;min-width:0}
.steps li:last-child{flex:none}
.st{white-space:nowrap;font-size:13.5px;font-weight:600;color:var(--muted)}
.st small{font-size:12px;font-weight:600;margin-left:5px;color:var(--accent)}
.steps li.done .st{color:var(--ink)}
.steps li.now .st{color:var(--accent);font-weight:800}
.ln{flex:1;height:2px;min-width:20px;margin:0 12px;background:var(--line)}
.steps li.done .ln{background:var(--accent)}
/* 본문 */
.main{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;padding:12px 0 40px}
nav{display:flex;flex-direction:column;gap:3px;position:sticky;top:12px;align-self:start}
nav button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted)}
nav button:hover{background:var(--sunk)}
nav button.on{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.badge{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;min-width:18px;text-align:center}
h1{font-size:22px;margin:4px 0 4px;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12.5px}
.btn{white-space:nowrap;font-weight:600;border-radius:6px;padding:8px 15px;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 11px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--sunk);color:var(--ink);white-space:nowrap;margin:0 4px 4px 0}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.lab{background:var(--lab-soft);color:var(--lab)}
.muted{color:var(--muted)}.small{font-size:12.5px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;vertical-align:top;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.flag td{background:var(--warn-soft)}
.raw{font-size:13px}.raw span{color:var(--muted);font-size:11.5px;margin-right:4px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}
pre{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:12px;overflow-x:auto;margin:6px 0 0;font-family:Consolas,ui-monospace,monospace;white-space:pre-wrap}
.note{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:9px;padding:8px 12px}
.who{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;margin-right:6px}
.who.ai{background:var(--accent-soft);color:var(--accent)}.who.sv{background:var(--good-soft);color:var(--good)}.who.ta{background:var(--warn-soft);color:var(--warn)}.who.code{background:var(--sunk);color:var(--muted)}
/* 시간표 */
.ttwrap{overflow-x:auto}
.tt{display:grid;grid-template-columns:62px repeat(5,minmax(118px,1fr));gap:4px;min-width:700px}
.tt .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.tt .t{font-size:12px;color:var(--muted);padding-top:6px;line-height:1.3}
.tt .t span{font-size:11px;opacity:.8}
.tt .cell{background:var(--sunk);border-radius:8px;min-height:62px;padding:4px;display:flex;flex-direction:column;gap:4px}
.blk{border-radius:7px;padding:5px 7px;background:var(--surface);border:1px solid var(--line);font-size:12px;line-height:1.35}
.blk b{display:block;font-size:12.5px}
.blk.temp{background:var(--warn-soft);border-color:var(--warn)}
.blk.changed{box-shadow:0 0 0 2px var(--good)}
.blk.mine{background:var(--accent-soft);border-color:var(--accent)}
.blk.dim{opacity:.4}
/* 시간 칠하기 */
.pw{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px}
.pg{display:grid;grid-template-columns:50px repeat(5,1fr);gap:4px;max-width:440px;touch-action:none;user-select:none;-webkit-user-select:none}
.pgh,.pgt{font-size:12px;color:var(--muted);font-weight:700;padding:3px 0;text-align:center}
.pgt{text-align:left;align-self:center}
.pc{height:32px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);font-size:11.5px;font-weight:700;cursor:pointer;color:var(--ink);padding:0}
.pc:disabled{cursor:default}
.m-must{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.m-want{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.m-no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mm{display:inline-grid;grid-template-columns:22px repeat(5,12px);gap:2px;font-size:10px;color:var(--muted);line-height:13px;margin-top:4px}
.mm span{text-align:center}
.mc{width:12px;height:13px;border-radius:3px;background:var(--sunk);border:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:4px;background:var(--sunk)}
.mc.m-must,.legend i.m-must{background:var(--accent);border-color:var(--accent)}
.mc.m-want,.legend i.m-want{background:var(--good-soft);border-color:var(--good)}
.mc.m-no,.legend i.m-no{background:repeating-linear-gradient(135deg,var(--bad) 0 2px,var(--bad-soft) 2px 4px);border-color:var(--bad)}
/* 조율 */
.msg{white-space:pre-wrap;background:var(--sunk);border-radius:6px;padding:12px 14px;font-size:13.5px;line-height:1.65}
.alt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:9px 12px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.alt .k{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.alt input{accent-color:var(--accent)}
.chk{font-size:12.5px;margin:3px 0}.chk.ok{color:var(--good)}.chk.no{color:var(--bad)}
.prop{border:1px solid var(--accent);border-left-width:3px;border-radius:6px;padding:12px 14px;margin-top:10px}
.prop .big{font-size:18px;font-weight:800}
.vs{font-size:13px;margin:3px 0}
.decided{background:var(--good-soft);color:var(--good);border-radius:9px;padding:8px 12px;font-weight:600;margin-top:10px}
.log li{margin-bottom:4px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.flow .b{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--surface)}
.flow .a{color:var(--muted)}
.lbl{font-size:12.5px;font-weight:600;margin:10px 0 4px}
/* AI 도우미 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:620px;overflow-y:auto;padding-right:4px}
.turn{max-width:82%}
.turn.ta{align-self:flex-end;background:var(--accent-soft);border-radius:8px 8px 2px 8px;padding:9px 13px}
.turn.bot{align-self:flex-start;background:var(--sunk);border-radius:8px 8px 8px 2px;padding:12px 14px;width:82%}
.trace{font-size:12px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.trace>div{margin-top:5px}
.trace code{font-family:Consolas,ui-monospace,monospace;font-size:11.5px;background:var(--surface);padding:1px 6px;border-radius:4px;color:var(--ink);word-break:break-all}
.chg{margin-top:8px;background:var(--surface);border-radius:8px}
.chg th,.chg td{padding:6px 8px;font-size:12.5px}
/* AI 도우미 패널: 어느 화면에서나 오른쪽에서 열린다 */
.fabs{position:fixed;right:24px;bottom:24px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.botfab,.ttfab{display:flex;align-items:center;gap:12px;border:0;border-radius:10px;padding:9px 20px 9px 9px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .15s}
.ttfab{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.ttfab .ic{background:var(--accent-soft)!important;color:var(--accent)!important}
.botfab:hover,.ttfab:hover{transform:translateY(-1px);filter:brightness(1.04)}
.botfab:focus-visible,.ttfab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.botfab .ic,.ttfab .ic{width:38px;height:38px;border-radius:7px;background:var(--accent-ink);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.botfab b,.ttfab b{display:block;font-size:15px;line-height:1.25}
.botfab small,.ttfab small{display:block;font-size:12.5px;font-weight:500;opacity:.85}
.botfab.new{animation:fabpulse 2.2s ease-out infinite}
@keyframes fabpulse{0%{box-shadow:0 4px 14px rgba(0,0,0,.18),0 0 0 0 rgba(47,74,115,.35)}100%{box-shadow:0 4px 14px rgba(0,0,0,.18),0 0 0 12px rgba(47,74,115,0)}}
@media (prefers-reduced-motion:reduce){.botfab.new{animation:none}.botfab,.ttfab{transition:none}}
@media (max-width:820px){.fabs{right:16px;bottom:16px}.botfab,.ttfab{padding-right:16px}.botfab small,.ttfab small{display:none}}
.botpanel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column}
.bph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bph b{font-size:15px}
.botpanel .chat{flex:1;max-height:none;padding:14px}
.botpanel form{border-top:1px solid var(--line);padding:10px 14px 14px}
.botpanel .turn{max-width:90%}
.botpanel .turn.bot{width:100%;max-width:100%}
.botex{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
/* 컴퓨터 화면 전용: 오른쪽 패널(AI 도우미·현재 시간표)을 열면 본문이 그만큼 비켜 선다 */
:root{--ttw:clamp(500px,44vw,680px)}
#app.botopen{padding-right:400px}#app.botopen .fabs{right:424px}
/* 현재 시간표 패널: AI 도우미처럼 어느 화면에서나 오른쪽에서 열린다 (둘 중 하나만 열림) */
.ttpanel{position:fixed;top:0;right:0;bottom:0;width:var(--ttw);z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column}
.ttpanel .bph{flex-wrap:wrap}
.ttpanel .ttbody{flex:1;overflow-y:auto;padding:12px 14px 16px}
.ttpanel .tt{min-width:0;grid-template-columns:46px repeat(5,minmax(0,1fr));gap:3px}
.ttpanel .tt .cell{min-height:44px;padding:3px;gap:3px}
.ttpanel .blk{padding:3px 5px;font-size:11px;line-height:1.3;overflow-wrap:anywhere}
.ttpanel .blk b{font-size:11.5px}
.ttpanel .tt .t{font-size:11px}
#app.ttopen{padding-right:var(--ttw)}
#app.ttopen .fabs{right:calc(var(--ttw) + 24px)}
#app.ttopen .cols,#app.botopen .cols{grid-template-columns:minmax(0,1fr)}
#app.ttopen .kpis{grid-template-columns:repeat(2,1fr)}
.blk.ghost.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.badge.new{animation:fabpulse 1.6s ease-out 3}
.blk.leave{opacity:.55;border-style:dashed}
.blk.ghost{background:var(--accent-soft);border:1.5px dashed var(--accent);color:var(--accent)}
/* v3에서 가져온 것: 확인창, 알림, 막힌 칸, 묶기, API 값 보기, 인쇄 */
.pc.blocked{background:repeating-linear-gradient(135deg,var(--line) 0 2px,var(--sunk) 2px 6px);color:var(--muted);font-weight:600;font-size:10.5px;cursor:not-allowed}
.blk.gen{background:repeating-linear-gradient(135deg,var(--line) 0 2px,var(--sunk) 2px 7px);border-style:dashed;color:var(--muted);text-align:center}
.legend i.blocked{background:repeating-linear-gradient(135deg,var(--line) 0 2px,var(--sunk) 2px 4px)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stub{font-size:11px;font-weight:700;border:1px dashed var(--muted);color:var(--muted);border-radius:5px;padding:0 6px;white-space:nowrap;cursor:help}
.prob{font-size:12.5px;color:var(--bad);margin:3px 0}
textarea.msgedit{min-height:220px;font-size:13.5px;line-height:1.65;background:var(--sunk)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px);display:none}
#toast.on{display:block}
dialog#dlg{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:20px;width:min(460px,calc(100% - 32px));box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog#dlg::backdrop{background:rgba(15,18,22,.45)}
dialog#dlg h2{margin-bottom:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-40px;z-index:70;background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:8px;font-weight:700}
.skip:focus{top:8px}
nav button[aria-current="page"]{color:var(--ink)}
@media print{
  .top .seg,.top select,.top .tog,nav,.fabs,.botpanel,.ttpanel,#toast,.no-print,button{display:none!important}
  body{background:#fff;color:#000}.main{display:block}.card{border-color:#999;break-inside:avoid}
  .tt{min-width:0}.blk{border-color:#666}#app.botopen{padding-right:0}
}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr)}
  nav{flex-direction:row;overflow-x:auto;position:static}
  nav button{white-space:nowrap;gap:6px}
  nav button.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .cols,.pw{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .turn,.turn.bot{max-width:100%;width:100%}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg" aria-labelledby="dlg-t"></dialog>

<script>
// ---------------- 기본 값 ----------------
const SLOTS=['09:00','10:30','12:00','13:30','15:00','16:30','18:00','19:30'];   // 75분 수업 (API 명세와 같은 8교시)
const DAYN='월화수목금';
const D5=[0,1,2,3,4];
// 주 2회 수업: 월~금 중 두 요일을 자유롭게 묶고, 두 번 다 같은 시각에 75분씩 (키 '02' = 월·수, '14' = 화·금)
const PAT={};for(let a=0;a<5;a++)for(let b=a+1;b<5;b++)PAT[`${a}${b}`]={days:[a,b],label:DAYN[a]+'·'+DAYN[b]};
const PKEYS=Object.keys(PAT);
const patOf=(a,b)=>a<b?`${a}${b}`:`${b}${a}`;
const CHAPEL={day:3,slot:2};   // 1학년 채플 (목 12:00, 가정)
const GEN={days:[1,3],slot:2};   // 교양필수 (화·목 12:00, 가상 규칙): 모든 학년 전공을 두지 않는다
const isGenCell=(d,s)=>GEN.days.includes(d)&&s===GEN.slot;
const EARLY_END_MIN=15;   // 고른 안이 이만큼 이내로만 넘기면 종료 조건으로 넣지 않는다 (API 명세)
const PARTNER={0:2,2:0,1:3,3:1};   // 묶어 칠하기 짝: 월↔수, 화↔목
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const toHM=v=>`${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;
const ROOMS=[ // 순서 = 일반 강의는 문화관부터, 실습실은 305부터
  {id:'문화관 201',bldg:'문화관',lab:false,cap:60},{id:'미래관 410',bldg:'미래관',lab:false,cap:60},{id:'정보관 210',bldg:'정보관',lab:false,cap:45},
  {id:'정보관 305',bldg:'정보관',lab:true,cap:50},{id:'정보관 306',bldg:'정보관',lab:true,cap:50}];   // cap = 정원 (가상)
const BLDGS=['문화관','미래관','정보관'];
const PRIO=['그 시간 아니면 안 되는 교수님(꼭 표시)','실습실 필요','연구실 위치','집 위치','임용 날짜'];
const RULES=['교수 겹침','강의실 겹침','같은 학년 전공필수 겹침','실습실이 필요하면 실습실로','강의실 정원 ≥ 인원','교수가 불가로 칠한 시간','1학년 채플 시간(목 12:00, 가정) 비우기','교양필수 시간(화·목 12:00, 가상 규칙) 비우기','단과대 건물(문화관·미래관·정보관)'];
const MARKS=['희망','불가'];
const CYC=[null,'희망','불가'];   // 칸을 누를 때마다 이 순서로 바뀜
const MCLS={꼭:'m-must',희망:'m-want',불가:'m-no'};
const mcls=m=>m?MCLS[m]||'':'';
const CONSN={any:'상관없음',want:'연강 선호',avoid:'연강 피함'};
const R=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const SIZES=R(6,12).map(i=>i*5);   // 인원: 30~60명, 5명 단위
// 칠하기 값 만들기: [[요일들, 교시들, 표시], ...] 뒤에 오는 것이 앞의 것을 덮는다
function P(spec){const p={};for(const [ds,ss,m] of spec)for(const d of ds)for(const s of ss)p[d+'-'+s]=m;return p}
const F=(spec,o={})=>({paint:P(spec),lab:false,size:null,pref:null,must:false,etc:'',etcOk:false,...o});
const emptyF=()=>F([]);

// 가상 데이터: 12개 분반 + 아무도 안 고른 1개. f = 교수님이 선택칸으로 낸 희망 (솔버가 그대로 읽는 값)
// 요일 0~4 = 월~금, 교시 0~7 = 09:00 10:30 12:00 13:30 15:00 16:30 18:00 19:30. 대부분 칸은 비워 둔다 (안 칠함 = 가능)
const COURSES0=[
 {id:'c1',name:'자료구조',sec:'01',prof:'가',year:2,req:true,f:F([[[0,2],[4],'희망']],{lab:true,pref:'정보관',must:true})},
 {id:'c2',name:'객체지향프로그래밍',sec:'02',prof:'나',year:2,req:true,
  f:F([[[0,2],[0,1],'불가'],[[0,2],[4],'희망']],{lab:true,pref:'정보관',etc:'실습 조교 1명 배정을 부탁드립니다.'})},
 {id:'c3',name:'자연언어처리',sec:'01',prof:'다',year:3,req:false,f:F([[[1,3],[0,1],'희망']])},
 {id:'c4',name:'운영체제',sec:'01',prof:'라',year:3,req:true,f:F([[[1,3],[0],'불가'],[[1,3],[3,4],'희망']],{pref:'정보관'})},
 {id:'c5',name:'컴퓨터네트워크',sec:'01',prof:'마',year:3,req:false,f:F([[[0,2],[5],'희망']],{pref:'미래관'})},
 {id:'c6',name:'인공지능',sec:'01',prof:'바',year:3,req:false,f:F([[[0,2],[1],'희망'],[[1,3],[0],'희망']])},
 {id:'c7',name:'데이터베이스',sec:'01',prof:'사',year:3,req:true,
  f:F([[[4],[4,5],'불가'],[[1,3],[4],'희망']],{lab:true,pref:'정보관',must:true,etc:'외부 강의가 있어 학기 중 두 번 대강이 필요합니다.'})},
 {id:'c8',name:'알고리즘',sec:'01',prof:'다',year:2,req:true,f:F([[[1,3],[3,4],'희망']])},
 {id:'c9',name:'기계학습',sec:'01',prof:'아',year:4,req:false,f:F([[[0,2],[1],'희망']])},
 {id:'c10',name:'컴퓨터구조',sec:'02',prof:'자',year:2,req:true,f:F([[[4],[0],'불가'],[[0,2],[3],'희망']])},
 {id:'c11',name:'소프트웨어공학',sec:'01',prof:'차',year:3,req:true,f:F([[[1,3],[6],'불가'],[[1,3],[4],'희망']],{lab:true,pref:'정보관'})},
 {id:'c12',name:'이산수학',sec:'01',prof:'카',year:1,req:true,f:F([[[0],[0],'불가'],[[0,2],[1],'희망']])},
 {id:'c13',name:'컴퓨터비전',sec:'01',prof:null,year:4,req:false},
];
// 담당 교수는 미리 정해지지 않는다. 위 prof는 그 분반을 고른 교수이고, 아래는 같은 분반을 고른 다른 교수 (담당 겹침 시연)
const EXTRA_CLAIMS=[{cid:'c9',prof:'바',f:F([[[0,2],[3,4],'희망']],{etc:'인공지능 수업과 같은 요일이면 좋겠습니다.'})}];
const CONSEC0={다:'avoid'};
const CAP={c1:50,c2:45,c3:45,c4:60,c5:50,c6:55,c7:40,c8:60,c9:45,c10:60,c11:40,c12:50,c13:40};   // 교수님이 고르는 인원의 기본값 (가상)
const PROFS=['가','나','다','라','마','바','사','아','자','차','카'];
const kindOf=c=>c.year===1&&c.req?'전공기초':c.req?'전공필수':'전공선택';
// 시연용 가상 회신 (차수 → 분반 → 답장)
const SCRIPT={1:{c2:'A나 B 괜찮아요. 수요일은 17시 전에 끝나야 해요.',c11:'셋 다 어렵습니다. 화요일, 목요일 오전이면 됩니다.'},2:{c11:'A로 할게요.'}};
const BOT_EX=['객체지향은 왜 밀렸어?','그 강의 C안으로 옮기면?','화요일 오전 비우면?','정보관 305 공사하면?','다 교수 강의 옮겨줘','알고리즘 화·목 16:30으로','지금 조율 중인 거 뭐 있어?','점심 메뉴 추천해줘'];

// ---------------- 상태 ----------------
const clone=o=>JSON.parse(JSON.stringify(o));
const mkClaim=(cid,prof,f)=>({cid,prof,f:{...f,size:f.size||CAP[cid]||40}});
function init(){
  const src=clone(COURSES0);
  const courses=src.map(({prof,f,...c})=>({...c}));
  const claims=[...src.filter(c=>c.prof).map(c=>mkClaim(c.id,c.prof,c.f)),...clone(EXTRA_CLAIMS).map(x=>mkClaim(x.cid,x.prof,x.f))];
  const s={role:'ta',prof:'나',view:'home',stage:'collect',round:0,courses,claims,pick:{},excl:{},consec:clone(CONSEC0),
    assign:{},status:{},blocker:{},reason:{},why:{},conds:{},moved:{},msgs:[],log:[],lastChanged:[],reveal:true,editing:null,room:'all',
    bot:{turns:[],last:null,pending:null},botOpen:false,botSeen:false,botFocus:false,
    method:'llm',llmFail:false,pair:{},
    ttOpen:false,peek:null,autoReply:true,confirms:[],mineOnly:false};   // method = 회신 해석 방식 (API: keyword | llm), peek = 시간표에 미리 볼 대안 {m,k}
  s.log.push({at:'희망 수집',t:`교수 ${new Set(claims.map(x=>x.prof)).size}명이 개설 분반 ${courses.length}개 중 맡을 분반을 골라 희망 ${claims.length}건을 냈습니다 (가상).`});
  return s;
}
// 담당 정리: 한 명만 고르면 그 교수, 여럿이면 조교가 고른 교수, 아무도 없으면 담당 없음
function sync(){
  for(const c of S.courses){
    const cl=S.claims.filter(x=>x.cid===c.id);
    const pick=S.excl[c.id]?null:(S.pick[c.id]&&cl.find(x=>x.prof===S.pick[c.id]))||(cl.length===1?cl[0]:null);
    c.own=S.excl[c.id]?'excl':pick?'ok':cl.length>1?'dup':'none';
    c.prof=pick?pick.prof:null;c.f=pick?pick.f:null;c.byTA=pick?!!pick.byTA:false;
  }
}
const ACT=()=>S.courses.filter(c=>c.own==='ok');
const claimOf=(cid,prof)=>S.claims.find(x=>x.cid===cid&&x.prof===prof);
const etcTodo=()=>ACT().filter(c=>c.f.etc&&!c.f.etcOk).length;
const todo=()=>S.courses.filter(c=>c.own==='dup'||c.own==='none').length+etcTodo();
let S=init();sync();
let BLOCK=null;   // AI 도우미의 가정 계산에서만 쓰는 임시 제약
let FAIL=null;

// ---------------- 도우미 ----------------
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=id=>S.courses.find(c=>c.id===id);
const full=c=>`${c.name} ${c.sec}`;
const ROOM=id=>ROOMS.find(r=>r.id===id);
const mins=i=>{const [h,m]=SLOTS[i].split(':').map(Number);return h*60+m};
const endMin=i=>mins(i)+75;
const endOf=i=>{const t=endMin(i);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`};
const roomText=(p,rm)=>rm[0]===rm[1]?rm[0]:`${DAYN[PAT[p].days[0]]} ${rm[0]} / ${DAYN[PAT[p].days[1]]} ${rm[1]}`;
const altLabel=a=>`${PAT[a.pat].label} ${SLOTS[a.slot]}~${endOf(a.slot)} · ${roomText(a.pat,a.rooms)}`;
const chip=(t,k='')=>`<span class="chip ${k}">${E(t)}</span>`;
const log=(at,t)=>S.log.push({at,t});
const hr=h=>h<8?h+12:h;
function slotOf(h,m=0){const t=h*60+m;let best=0,bd=1e9;SLOTS.forEach((_,i)=>{const d=Math.abs(mins(i)-t);if(d<bd){bd=d;best=i}});return best}
const stageIdx=()=>({collect:0,draft:1,round:2,review:3,confirm:3,final:4})[S.stage];
const openMsgs=()=>S.msgs.filter(m=>m.round===S.round&&S.stage==='round');
// 조사 고르기 (받침 유무). 숫자는 읽는 소리로 본다
function jong(w){const ch=String(w).trim().slice(-1);const dg={0:21,1:8,2:0,3:16,4:0,5:0,6:1,7:8,8:8,9:0};
  if(ch in dg)return dg[ch];const k=ch.charCodeAt(0)-0xAC00;return k>=0&&k<11172?k%28:0}
const jo=(w,a,b)=>w+(jong(w)?a:b);
const ro=w=>{const j=jong(w);return w+(j&&j!==8?'으로':'로')};

// ---------------- 희망 (선택칸 값을 그대로 읽는다) ----------------
const mk=(f,d,s)=>f.paint[d+'-'+s]||null;
const isWant=m=>m==='꼭'||m==='희망';
const hardOk=(c,p,s)=>!PAT[p].days.some(d=>mk(c.f,d,s)==='불가');
// 희망 자리: 두 요일 모두 꼭/희망인 (요일 짝, 시각). 없으면 한쪽만 칠한 것
function wishedF(f){const both=[],part=[];
  for(const p of PKEYS)for(let s=0;s<SLOTS.length;s++){
    const ms=PAT[p].days.map(d=>mk(f,d,s));if(ms.includes('불가'))continue;
    if(isWant(ms[0])&&isWant(ms[1]))both.push({pat:p,slot:s});else if(isWant(ms[0])||isWant(ms[1]))part.push({pat:p,slot:s});}
  return both.length?both:part}
const wished=c=>wishedF(c.f);
const strengthF=f=>f.must?'꼭':'선호';
const wishOkAt=(c,p,s)=>{const W=wished(c);return !W.length||W.some(w=>w.pat===p&&w.slot===s)};
// 요일마다 희망 칸을 모으고, 희망 시각이 같은 요일끼리 묶어서 적는다 (예: 월·수 15:00)
function wishText(f,room=true){
  const groups=[];
  for(const d of D5){const ss=R(0,SLOTS.length-1).filter(s=>isWant(mk(f,d,s)));if(!ss.length)continue;
    const g=groups.find(x=>x.key===ss.join());if(g)g.days.push(d);else groups.push({key:ss.join(),days:[d],ss})}
  if(!groups.length)return '희망 시간 없음';
  const runs=ss=>{const o=[];let i=0;while(i<ss.length){let j=i;while(j+1<ss.length&&ss[j+1]===ss[j]+1)j++;o.push(i===j?SLOTS[ss[i]]:SLOTS[ss[i]]+'~'+endOf(ss[j]));i=j+1}return o.join(', ')};
  return groups.map(g=>`${g.days.map(d=>DAYN[d]).join('·')} ${runs(g.ss)}`).join(' / ')+(room&&f.pref&&f.pref.includes(' ')?' · '+f.pref:'')}
const wishLabel=c=>wishText(c.f);
function cellsOf(f,m){return Object.entries(f.paint).filter(([,v])=>v===m).map(([k])=>{const [d,s]=k.split('-').map(Number);return `${DAYN[d]} ${SLOTS[s]}`})}
function fJson(c){return JSON.stringify({분반:full(c),담당:c.prof+' 교수',희망자리:wishText(c.f,false),꼭:!!c.f.must,희망:cellsOf(c.f,'희망'),불가:cellsOf(c.f,'불가'),
  인원:c.f.size+'명',실습실:c.f.lab?'필요':'필요 없음',건물선호:c.f.pref,연강:CONSN[S.consec[c.prof]||'any'],기타요청:c.f.etc?'조교가 직접 확인 (자동 배정에 안 들어감)':null},null,1)}
function fChips(f,prof){const a=[],cnt=m=>Object.values(f.paint).filter(x=>x===m).length;
  a.push(wishedF(f).length?chip('희망 '+wishText(f,false),'good'):chip('희망 시간 없음 (아무 때나)'));
  if(f.must)a.push(chip('꼭 (희망 시간 아니면 어려움)','warn'));
  if(cnt('불가'))a.push(chip(`불가 ${cnt('불가')}칸`,'bad'));
  a.push(chip(`인원 ${f.size}명`));
  if(f.lab)a.push(chip('실습실 필요','lab'));
  if(f.pref)a.push(chip(f.pref.includes(' ')?f.pref:f.pref+' 선호'));
  if(prof&&S.consec[prof]&&S.consec[prof]!=='any')a.push(chip(CONSN[S.consec[prof]]));
  if(f.etc)a.push(chip(f.etcOk?'기타 요청 · 조교 확인함':'기타 요청 · 조교 확인 전',f.etcOk?'good':'warn'));
  return a.join('');}
function miniMap(f){let h=`<div class="mm" aria-hidden="true"><span></span>${D5.map(d=>`<span>${DAYN[d]}</span>`).join('')}`;
  SLOTS.forEach((t,k)=>{h+=`<span>${t.slice(0,2)}</span>`+D5.map(d=>{const m=mk(f,d,k);return `<span class="mc ${mcls(m)}" title="${DAYN[d]} ${t} ${m||'가능'}"></span>`}).join('')});
  return h+'</div>'}

// ---------------- NLP: 조율 회신 해석 (시안: 키워드 규칙으로 흉내. 실제는 backend/app/nlp/coord.py parse_reply) ----------------
// 돌려주는 모양은 API 명세 ReplyParse와 같다: {kind, picks, conditions:{day_slots, end_before}, note, method, fallback, fallback_reason}
const emptyCond=()=>({day_slots:{},end_before:[]});
const hasCond=k=>!!k&&(Object.keys(k.day_slots||{}).length>0||(k.end_before||[]).length>0);
const NOTE_RE=/[^.。!?\n]*(강의실\s*\d{3}|계단식|PC|컴퓨터|빔\s*프로젝터|마이크|칠판|조정\s*희망)[^.。!?\n]*/;
const winOf=t=>/늦은\s*오후/.test(t)?[5,7]:/오전/.test(t)?[0,1]:/저녁/.test(t)?[6,7]:/오후/.test(t)?[3,5]:null;
function parseReply(text,choice,alts,method){
  const t=(text||'').trim(),cond=emptyCond();
  let rest=t,picks=[...t.matchAll(/(?<![A-Za-z])([ABC])(?![A-Za-z])/g)].map(m=>m[1]);
  [...t.matchAll(/(첫|두|세)\s*번째/g)].forEach(m=>picks.push({첫:'A',두:'B',세:'C'}[m[1]]));
  if(choice&&choice!=='none')picks.unshift(choice);
  const none=choice==='none'||/(셋\s*다|모두|전부|다)\s*(어렵|안\s?되|안\s?돼|불가|힘들)/.test(t);
  picks=none?[]:[...new Set(picks)];
  for(const m of t.matchAll(/([월화수목금])요?일?[은는]?\s*(\d{1,2})시\s*(반)?\s*(?:전|이전|까지)/g)){
    rest=rest.replace(m[0],' ');
    const day=DAYN.indexOf(m[1]),lim=hr(+m[2])*60+(m[3]?30:0);
    // 고른 안이 15분 이내로만 넘기면 교수 재량으로 보고 조건에 넣지 않는다 (EARLY_END_MIN)
    const picked=picks.map(k=>(alts||[]).find(a=>a.k===k)).filter(a=>a&&PAT[a.pat].days.includes(day));
    if(picked.length&&picked.every(a=>endMin(a.slot)<=lim+EARLY_END_MIN))continue;
    cond.end_before.push({day,time:toHM(lim)});
  }
  if(!picks.length){

function clash(cid,p,s,rm){
  const c=C(cid),days=PAT[p].days;
  if(c.year===1&&s===CHAPEL.slot&&days.includes(CHAPEL.day))return {why:'채플 시간'};
  if(days.some(d=>isGenCell(d,s)))return {why:'교양필수 시간'};
  if(BLOCK){if(BLOCK.room&&rm.includes(BLOCK.room))return {why:'못 쓰는 강의실'};
    if(BLOCK.cells&&days.some(d=>BLOCK.cells.has(d+'-'+s)))return {why:'비우기로 한 시간'};}

    if(o.id===cid)continue;const a=S.assign[o.id];
    if(!a||a.slot!==s)continue;
    const od=PAT[a.pat].days,share=days.filter(d=>od.includes(d));if(!share.length)continue;   // 겹치는 요일이 있을 때만
    if(share.some(d=>a.rooms[od.indexOf(d)]===rm[days.indexOf(d)]))return {why:'강의실 겹침',by:o.id};
    if(o.prof&&o.prof===c.prof)return {why:'교수 겹침',by:o.id};

// 소프트 비용: 칠한 칸 + 희망 자리와의 거리 + 강의실 + 연강

function dist(c,p,s){const W=wished(c);if(!W.length)return 0;
  return Math.min(...W.map(w=>Math.abs(w.slot-s)+3*PAT[p].days.filter(d=>!PAT[w.pat].days.includes(d)).length));}
function roomCost(c,rm){let v=0;const pr=c.f.pref;
  rm.forEach((r,i)=>{const X=ROOM(r),nl=needLab(c,i);
    if(!nl&&X.lab)v+=3;
    if(pr){if(pr.includes(' ')){const Q=ROOM(pr);if(nl||!Q.lab)v+=r===pr?0:X.bldg===Q.bldg?2.25:3;else v+=X.bldg===Q.bldg?0:1.5}

function genAlts(c,k=emptyCond()){
  const list=[];
  for(const p of PKEYS)for(const s of R(0,SLOTS.length-1)){
    if(!hardOk(c,p,s)||!condOk(p,s,k).ok)continue;
    for(const rm of pairsFor(c)){if(clash(c.id,p,s,rm))continue;list.push({pat:p,slot:s,rooms:rm,score:cost(c,p,s,rm)})}}
  list.sort((a,b)=>a.score-b.score||a.slot-b.slot);

  for(const a of list){const key=a.pat+a.slot;if(!seen.has(key)){seen.add(key);out.push(a)}if(out.length===3)break}

function makeDraft(){

  const order=ACT().sort((a,b)=>key(a)-key(b)||S.courses.indexOf(a)-S.courses.indexOf(b));

}

function check(m){

const ALIAS={객프:'c2',객체지향:'c2',자구:'c1',소공:'c11',운체:'c4',컴네:'c5',네트워크:'c5',자연어:'c3',인공지능:'c6',데베:'c7',디비:'c7',알고리즘:'c8',기계학습:'c9',머신러닝:'c9',컴구:'c10',이산:'c12',비전:'c13'};
function parseCmd(t){
  const q={intent:null,courses:[],prof:null,coref:false,alt:null,pat:null,day:null,slot:null,win:null,room:null,raw:t};
  for(const c of S.courses)if(t.includes(c.name))q.courses.push(c.id);
  for(const [a,id] of Object.entries(ALIAS))if(t.includes(a)&&!q.courses.includes(id))q.courses.push(id);
  const pm=t.match(/([가나다라마바사아자차카])\s*교수/);if(pm)q.prof=pm[1];
  q.coref=/그\s*(강의|수업|과목|분반|거)|그거|아까\s*(그|거|강의)|방금\s*(그|거|강의)/.test(t);
  const am=t.match(/(?<![A-Za-z])([ABC])(?![A-Za-z])/);if(am)q.alt=am[1];
  const pp=t.match(/([월화수목금])(?:요일)?\s*(?:과|와|하고|[·,\/])?\s*([월화수목금])(?!업|정|강|학)/);
  if(pp&&pp[1]!==pp[2])q.pat=patOf(DAYN.indexOf(pp[1]),DAYN.indexOf(pp[2]));
  else{const dm=t.match(/([월화수목금])요일/)||t.match(/(?:^|\s)([월화수목금])(?=\s|$)/);if(dm)q.day=DAYN.indexOf(dm[1])}
  const tm=t.match(/(\d{1,2})(?::(\d{2})|\s*시(\s*반)?)/);if(tm)q.slot=slotOf(hr(+tm[1]),tm[2]?+tm[2]:tm[3]?30:0);
  if(/오전/.test(t))q.win=[0,1];else if(/저녁/.test(t))q.win=[6,7];else if(/오후/.test(t))q.win=[3,5];
  const rm=t.match(/(201|410|210|305|306)/);if(rm)q.room=ROOMS.find(r=>r.id.endsWith(rm[1])).id;
  if(/왜|이유|어째서/.test(t))q.intent='explain';
  else if(q.room&&/(못\s*쓰|공사|막|빼|없으면|안\s*되|닫)/.test(t))q.intent='room';
  else if((q.day!=null||q.pat)&&!q.courses.length&&!q.coref&&!q.prof&&/(비우|빼|막|안\s*되|없애|쉬)/.test(t))q.intent='block';
  else if(/(옮기|옮겨|바꾸|바꿔|이동|넣어|넣으)/.test(t))q.intent=/(면|어때|될까|\?)/.test(t)?'whatif':'move';
  else if(/(뭐|몇|목록|남은|현황|상황|어디|있어|알려)/.test(t))q.intent='status';
  return q;
}
const hasInfo=q=>q.courses.length||q.prof||q.coref||q.alt||q.room||q.slot!=null||q.pat||q.day!=null||q.win;
function botRun(text){
  const b=S.bot;b.turns.push({who:'ta',text});

       day:q.day??p.day,slot:q.slot??p.slot,win:q.win||p.win,room:q.room||p.room,raw:p.raw+' → '+text,merged:true};}

  for(let it=0;it<8;it++){let moved=false;
    for(const o of ACT()){
      if(fixed.has(o.id))continue;const a=S.assign[o.id];if(!a)continue;
      if(!clash(o.id,a.pat,a.slot,a.rooms)&&hardOk(o,a.pat,a.slot))continue;
      const alts=genAlts(o,S.conds[o.id]||{});if(!alts.length){FAIL=o.id;return false}
      S.assign[o.id]={pat:alts[0].pat,slot:alts[0].slot,rooms:alts[0].rooms,temp:a.temp};fixed.add(o.id);moved=true;}

function sim(fn){

    const lbl=`${days.map(d=>DAYN[d]).join('·')}요일 ${ss.length===SLOTS.length?'전체':ss.length===1?SLOTS[ss[0]]:SLOTS[ss[0]]+'~'+endOf(ss[ss.length-1])}`;
    T.info['비울 시간']=lbl;T.tool=`what_if(비울 시간="${lbl}")`;
    const r=sim(()=>{BLOCK={cells:new Set(days.flatMap(d=>ss.map(s=>d+'-'+s)))};return repair(new Set())});
    return withPreview(T,r,`${jo(lbl,'을','를')} 비우면`,null,q.raw);
  }
  if(q.intent==='room'){
    T.info.강의실=q.room;T.tool=`what_if(못 쓰는 강의실="${q.room}")`;
    const r=sim(()=>{BLOCK={room:q.room};return repair(new Set())});
    return withPreview(T,r,`${jo(q.room,'을','를')} 못 쓰면`,null,q.raw);
  }
  return T;
}

function livePreview(){
  if(S.role!=='ta'||!S.botOpen)return null;
  for(let i=S.bot.turns.length-1;i>=0;i--){const p=S.bot.turns[i].preview;if(p)return !p.state&&p.base===JSON.stringify(S.assign)?p:null}

}
// 조율 대안 미리 보기: 조교가 고른 안으로 옮기면 어디로 가는지 (아직 반영 전)
function peekInfo(){
  if(!S.peek||S.stage!=='round')return null;
  const m=S.msgs.find(x=>x.id===S.peek.m);if(!m||!openMsgs().includes(m))return null;
  const a=m.alts.find(x=>x.k===S.peek.k);if(!a)return null;
  const to={pat:a.pat,slot:a.slot,rooms:a.rooms},cur=S.assign[m.cid],hit=clash(m.cid,a.pat,a.slot,a.rooms);
  return {m,cid:m.cid,k:a.k,to,same:!!cur&&sameSpot(cur,to),hit};
}
function grid(opt={}){
  const pv=opt.prof?null:livePreview(),pk=opt.prof?null:peekInfo();
  const moving=new Set([...(pv?pv.changes.map(x=>x.cid):[]),...(pk&&!pk.same?[pk.cid]:[])]);
  const ghostList=[...(pv?pv.changes.map(x=>({cid:x.cid,to:x.to,tag:'AI 도우미 미리보기',bad:false})):[]),
    ...(pk?[{cid:pk.cid,to:pk.to,tag:pk.same?`${pk.k}안 = 지금 자리`:`${pk.k}안으로 옮기면${pk.hit?` · ${pk.hit.why}`:''}`,bad:!!pk.hit}]:[])];
  const head=`<div></div>${D5.map(d=>`<div class="h">${DAYN[d]}</div>`).join('')}`;
  let body='';
  SLOTS.forEach((s,i)=>{
    body+=`<div class="t">${s}<br><span>~${endOf(i)}</span></div>`;
    for(const d of D5){
      const blks=S.courses.map(c=>{const a=S.assign[c.id];if(!a||a.slot!==i)return '';const k=PAT[a.pat].days.indexOf(d);if(k<0)return '';
        if(opt.mine&&c.prof!==opt.prof)return '';
        const room=a.rooms[k];if(S.room!=='all'&&room!==S.room)return '';
        const cls=[a.temp?'temp':'',S.lastChanged.includes(c.id)?'changed':'',moving.has(c.id)?'leave':'',opt.prof?(c.prof===opt.prof?'mine':'dim'):''].join(' ');
        return `<div class="blk ${cls}"><b>${E(full(c))}</b>${E(room)}<br><span class="muted">${E(c.prof)} 교수 · ${c.year}학년${c.req?' 전필':''}${a.temp?' · 조율 중':''}${moving.has(c.id)?' · 옮겨질 자리':''}</span></div>`}).join('');
      const ghosts=ghostList.map(x=>{const k=PAT[x.to.pat].days.indexOf(d);if(x.to.slot!==i||k<0)return '';const room=x.to.rooms[k];if(S.room!=='all'&&room!==S.room)return '';
        return `<div class="blk ghost${x.bad?' bad':''}"><b>→ ${E(full(C(x.cid)))}</b>${E(room)}<br><span>${E(x.tag)}</span></div>`}).join('');
      const gen=isGenCell(d,i)&&!blks&&!ghosts?'<div class="blk gen">교양필수<br><span class="small">가상 규칙</span></div>':'';
      body+=`<div class="cell">${blks}${ghosts}${gen}</div>`;
    }
  });
  const filt=`<div class="row" style="margin-bottom:10px"><label class="small muted" for="roomsel${opt.drawer?'-d':''}">강의실</label><select id="roomsel${opt.drawer?'-d':''}" data-chg="room"><option value="all">전체</option>${ROOMS.map(r=>`<option ${S.room===r.id?'selected':''}>${r.id}</option>`).join('')}</select>
    <span class="chip warn">조율 중(임시 배치)</span>${S.lastChanged.length?'<span class="chip good">방금 바뀜</span>':''}${opt.prof&&!opt.mine?'<span class="chip accent">내 강의</span>':''}${pv?'<span class="chip accent">점선 = AI 도우미 미리보기 (적용 전)</span>':''}${pk?`<span class="chip accent">점선 = ${E(full(C(pk.cid)))} ${pk.k}안 미리 보기 (반영 전)</span>`:''}</div>`;
  return filt+`<div class="ttwrap"><div class="tt">${head}${body}</div></div>`;
}

function botTurn(t,i){
  const info=Object.entries(t.info).map(([k,v])=>chip(`${k}: ${v}`)).join('');
  const ik=t.intent==='범위 밖'||t.intent==='확인 필요'?'warn':'accent';
  const trace=`<details class="trace"><summary>AI가 읽은 내용</summary><div><span class="who ai">AI</span>의도 ${chip(t.intent,ik)}${t.ask?chip('되묻기','warn'):''}${info}</div>
    ${t.tool?`<div><span class="who ai">AI</span>도구 호출 <code>${E(t.tool)}</code></div>`:''}
    ${t.solver?`<div><span class="who sv">계산</span>${E(t.solver)}</div>`:''}</details>`;
  let h=`<div class="turn bot"><div>${E(t.text)}</div>`;
  if(t.preview){const p=t.preview;
    h+=`<div class="tblwrap"><table class="chg"><tr><th>분반</th><th>지금 → 바꾸면</th><th>희망</th></tr>${p.changes.map(x=>{const c=C(x.cid),ok=wishOkAt(c,x.to.pat,x.to.slot);
      return `<tr><td style="min-width:104px"><b>${E(full(c))}</b><div class="small muted">${E(c.prof)} 교수</div></td><td><span class="muted">${E(altLabel(x.from))}</span><br>→ <b>${E(altLabel(x.to))}</b></td><td>${chip(ok?'안':'밖',ok?'good':'warn')}</td></tr>`}).join('')}</table></div>`;
    h+=p.state==='applied'?'<div class="decided">적용했습니다</div>':p.state==='cancel'?'<div class="note" style="margin-top:8px">취소했습니다</div>'
      :p.state==='stale'?'<div class="note" style="margin-top:8px">그사이 시간표가 바뀌어 다시 계산해야 합니다</div>'
      :`<div class="row" style="margin-top:10px"><button class="btn primary small" data-act="botApply" data-i="${i}">적용</button><button class="btn small" data-act="botCancel" data-i="${i}">취소</button>${S.view!=='draft'?`<button class="btn small" data-act="go" data-v="draft">시간표에서 보기</button>`:''}</div><div class="small muted" style="margin-top:6px">적용을 누르면 사유를 받고 다시 확인합니다. 그전에는 시간표가 바뀌지 않습니다.</div>`;
  }
  return h+trace+'</div>';
}

    <div class="seg" role="group" aria-label="역할"><button class="${S.role==='ta'?'on':''}" data-act="role" data-v="ta" aria-pressed="${S.role==='ta'}">조교</button><button class="${S.role==='prof'?'on':''}" data-act="role" data-v="prof" aria-pressed="${S.role==='prof'}">교수</button></div>
    ${S.role==='prof'?`<select data-chg="prof" aria-label="교수 고르기">${PROFS.map(p=>`<option value="${p}" ${p===S.prof?'selected':''}>${p} 교수</option>`).join('')}</select>`:''}</div></header>
  <div class="wrap">${stepsBar()}<div class="main"><nav aria-label="메뉴">${items.map(([k,t,n])=>`<button class="${S.view===k?'on':''}" data-act="go" data-v="${k}" ${S.view===k?'aria-current="page"':''}><span>${t}</span>${n?`<span class="badge${k==='coord'||k==='final'||k==='pmsg'?' new':''}" aria-label="${n}건">${n}</span>`:''}</button>`).join('')}</nav>
  <main id="main" tabindex="-1">${V()}</main></div></div>
  ${showTT&&S.ttOpen?ttDrawer():''}
  ${S.role!=='ta'?'':`<div class="fabs">${showTT&&!S.ttOpen?`<button class="ttfab" data-act="ttOpen" aria-label="현재 시간표 열기"><span class="ic">${TT_ICON}</span><span><b>현재 시간표</b><small>오른쪽에 열어 두고 보기</small></span></button>`:''}
    ${S.botOpen?'':`<button class="botfab${S.botSeen?'':' new'}" data-act="botOpen" aria-label="AI 도우미 열기"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg></span><span><b>AI 도우미</b><small>시간표를 말로 물어보기</small></span></button>`}</div>
    ${S.botOpen?botPanel():''}`}`;
  const app=document.getElementById('app');app.className=[S.role==='ta'&&S.botOpen?'botopen':'',showTT&&S.ttOpen?'ttopen':''].join(' ').trim();
  document.querySelectorAll('main h1').forEach(h=>h.setAttribute('tabindex','-1'));
  if(!document.getElementById('dlg').open)restoreFocus(fk);
  if(sn)restoreFields(sn);
  if(S.role==='ta'&&S.botOpen){const ch=document.getElementById('chat');if(ch)ch.scrollTop=ch.scrollHeight;if(S.botFocus){const i=document.getElementById('botq');if(i)i.focus()}}
  S.botFocus=false;
}

// ---------------- 시간 칠하기 ----------------
let PAINT=null;
function setOne(x,d,k,mark){const key=d+'-'+k;if(mark)x.f.paint[key]=mark;else delete x.f.paint[key];
  const e=document.querySelector(`[data-paint="${x.cid}"][data-d="${d}"][data-s="${k}"]`);
  if(e){e.className='pc '+mcls(mark);e.textContent=mark||'';e.setAttribute('aria-label',`${DAYN[d]} ${SLOTS[k]} ${mark||'가능'}`)}}
// 묶기를 켰으면 짝 요일(월↔수, 화↔목) 칸도 같은 값으로. 교양필수·채플 칸은 건너뛴다
function setMark(x,d,k,mark){setOne(x,d,k,mark);
  const pr=S.pair[x.cid]||{},q=PARTNER[d];if(q==null)return;
  if(((d===0||d===2)&&pr.mw)||((d===1||d===3)&&pr.tt)){if(!blockedCell(C(x.cid).year,q,k))setOne(x,q,k,mark)}}
function paintCell(el){const x=claimOf(el.dataset.paint,S.prof);if(!x)return;setMark(x,+el.dataset.d,+el.dataset.s,PAINT.mark);PAINT.dirty=true}
function startPaint(el){const x=claimOf(el.dataset.paint,S.prof);if(!x)return false;const cur=mk(x.f,+el.dataset.d,+el.dataset.s);
  PAINT={cid:el.dataset.paint,mark:CYC[(CYC.indexOf(cur)+1)%CYC.length],dirty:false,last:el};paintCell(el);return true}
function endPaint(){if(!PAINT)return;const p=PAINT;PAINT=null;if(p.dirty)render()}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-paint]');if(!el||el.disabled)return;e.preventDefault();startPaint(el)});
document.addEventListener('pointermove',e=>{if(!PAINT)return;const hit=document.elementFromPoint(e.clientX,e.clientY);const el=hit&&hit.closest('[data-paint]');
  if(!el||el===PAINT.last||el.dataset.paint!==PAINT.cid||el.disabled)return;PAINT.last=el;paintCell(el)});
document.addEventListener('pointerup',endPaint);
document.addEventListener('pointercancel',endPaint);

// ---------------- 이벤트 ----------------
function applyBot(i,reason){
  const p=S.bot.turns[i].preview;
  if(JSON.stringify(S.assign)!==p.base){p.state='stale';toast('그사이 시간표가 바뀌어 다시 계산해야 합니다');return}
  S.assign=clone(p.after);
  for(const ch of p.changes){const id=ch.cid;S.assign[id].temp=false;S.moved[id]=`요청 "${p.raw}" · 사유 "${reason}"`;
    if(S.status[id]==='open'){S.status[id]='done';openMsgs().filter(x=>x.cid===id&&!x.decision).forEach(x=>x.decision={kind:'AI 도우미로 옮김',action:{type:'keep'},reason})}}
  S.lastChanged=p.changes.map(x=>x.cid);p.state='applied';
  log('AI 도우미',`"${p.raw}" 적용 · 사유 "${reason}" · 바뀐 분반 ${p.changes.length}개 (${p.changes.map(x=>full(C(x.cid))).join(', ')}).`);
  toast(`적용했습니다 · 바뀐 분반 ${p.changes.length}개`);
}
function sendOne(m,i=0){const ps=checkMessage(m.text,m);if(ps.length)return false;m.sent=true;log(`${m.round}차 조율`,`${full(C(m.cid))}: ${C(m.cid).prof} 교수님께 조율 메시지를 보냈습니다.`);later(()=>autoReply(m),i);return true}
function reparse(){openMsgs().filter(m=>m.reply&&!m.decision).forEach(m=>{m.parsed=parseReply(m.reply.text,m.reply.choice,m.alts,S.method)})}
document.addEventListener('click',e=>{
  const pe=e.target.closest('[data-paint]');
  if(pe){if(e.detail===0&&!pe.disabled&&startPaint(pe))endPaint();return}   // 키보드로 누른 경우
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,m=t.dataset.m?S.msgs.find(x=>x.id===t.dataset.m):null;
  if(a==='dlgNo'){closeDlg();return}
  if(a==='role'){S.role=t.dataset.v;S.view=S.role==='ta'?'home':'pwish'}
  else if(a==='go')S.view=t.dataset.v;
  else if(a==='theme'){applyTheme(t.dataset.v)}
  else if(a==='themeNext'){const k=THEMES.findIndex(x=>x[0]===savedTheme()),n=THEMES[(k+1)%THEMES.length];applyTheme(n[0]);toast(`테마: ${n[1]}`)}
  else if(a==='pair'){const c=t.dataset.c,k=t.dataset.v;S.pair={...S.pair,[c]:{...(S.pair[c]||{}),[k]:!(S.pair[c]||{})[k]}}}
  else if(a==='etcOk'){const c=C(t.dataset.c);c.f.etcOk=true;log('희망 수집',`${full(c)}: 기타 요청 "${c.f.etc}"을(를) 조교가 확인했습니다.`)}
  else if(a==='etcUndo'){C(t.dataset.c).f.etcOk=false}
  else if(a==='pick'){S.pick[t.dataset.c]=t.dataset.p;sync();log('희망 수집',`${full(C(t.dataset.c))}: 담당 겹침 → 조교가 ${t.dataset.p} 교수로 정했습니다.`)}
  else if(a==='unpick'){delete S.pick[t.dataset.c];S.claims=S.claims.filter(x=>!(x.cid===t.dataset.c&&x.byTA));sync()}
  else if(a==='assignNone'){const cid=t.dataset.c,p=document.getElementById('np-'+cid).value;
    S.claims.push({...mkClaim(cid,p,emptyF()),byTA:true});S.pick[cid]=p;sync();log('희망 수집',`${full(C(cid))}: 담당 없음 → 조교가 ${p} 교수로 지정했습니다 (희망 없음).`)}
  else if(a==='excl'){S.excl[t.dataset.c]=true;sync();log('희망 수집',`${full(C(t.dataset.c))}: 이번 학기 제외`)}
  else if(a==='unexcl'){delete S.excl[t.dataset.c];sync()}
  else if(a==='draft'){makeDraft();S.view='draft';toast('초안을 만들었습니다')}
  else if(a==='publish'){askConfirm({title:'초안을 공개할까요?',body:'모든 교수님께 초안을 공개하고, 밀린 분반의 조율 메시지 초안을 만듭니다.\n메시지는 조율 화면에서 확인하고 [보내기]를 눌러야 갑니다.',ok:'공개'},()=>{publish();S.view='coord';toast('초안을 공개했습니다')});return}
  else if(a==='sendOne'){if(!sendOne(m)){toast('메시지 검사에 걸려 보내지 않았습니다');const ta=document.getElementById('mt-'+m.id);if(ta)ta.focus();return}toast('보냈습니다')}
  else if(a==='sendAll'){const us=openMsgs().filter(x=>!x.sent);let n=0;const ok=us.filter(x=>sendOne(x,n)&&++n).length;toast(ok===us.length?`${ok}건 보냈습니다`:`${ok}건 보냄 · ${us.length-ok}건은 검사에 걸려 남겼습니다`)}
  else if(a==='msgReset'){m.text=m.text0}
  else if(a==='method'){S.method=t.dataset.v;if(S.method!=='llm')S.llmFail=false;reparse();toast(`회신 해석: ${S.method==='llm'?'언어 모델':'키워드'}`)}
  else if(a==='fake'){openMsgs().filter(x=>x.sent&&!x.reply).forEach(x=>receive(x,(SCRIPT[S.round]||{})[x.cid]||'A로 할게요.',null,'가상 회신'));toast('가상 회신을 받았습니다')}
  else if(a==='confirm'){const pr=check(m);if(pr.action==='decide')return;
    askConfirm({title:'처리안을 확인할까요?',body:`${full(C(m.cid))} · ${pr.text}\n[재배정]을 누를 때 시간표에 반영됩니다.`},()=>{m.decision=toDecision(pr,'확인');S.editing=null;log(`${S.round}차 조율`,`${full(C(m.cid))}: 조교 확인 · ${pr.text}`)});return}
  else if(a==='edit'||a==='keep'){const k0=check(m).key||m.alts[0].k;S.editing={m:m.id,mode:a,sel:k0};if(a==='edit'){S.peek={m:m.id,k:k0};S.ttOpen=true;S.botOpen=false}}
  else if(a==='peek'){const on=S.peek&&S.peek.m===m.id&&S.peek.k===t.dataset.v;S.peek=on?null:{m:m.id,k:t.dataset.v};if(!on&&S.view!=='draft'){S.ttOpen=true;S.botOpen=false}}
  else if(a==='peekOff'){S.peek=null}
  else if(a==='ttOpen'){S.ttOpen=true;S.botOpen=false}
  else if(a==='ttClose'){S.ttOpen=false;render();const f=document.querySelector('.ttfab');if(f)f.focus();return}
  else if(a==='mineOnly'){S.mineOnly=t.dataset.v==='1'}
  else if(a==='sendConfirm'){askConfirm({title:'확정 요청을 보낼까요?',body:`교수님 ${profsWithCourses().length}명께 최종 시간표와 확정 요청 메시지를 보냅니다.\n모두 [확정]을 누르면 내보낼 수 있습니다.`,ok:'보내기'},()=>{sendConfirms();toast('확정 요청을 보냈습니다')});return}
  else if(a==='fakeConfirm'){S.confirms.filter(k=>!k.reply).forEach(k=>receiveConfirm(k,'','가상 회신'))}
  else if(a==='confirmManual'){const k=S.confirms.find(x=>x.id===t.dataset.v);
    askConfirm({title:`${k.prof} 교수님 확정을 직접 처리할까요?`,body:'회신 없이 확정한 것으로 기록합니다.',ok:'확정 처리',reason:true,placeholder:'예: 전화로 확인함'},reason=>{receiveConfirm(k,'','조교 직접 처리');k.reply.reason=reason;log('확정 요청',`${k.prof} 교수님: 조교 직접 처리 · 사유 "${reason}"`)});return}
  else if(a==='cancel')S.editing=null;
  else if(a==='save'){
    const why=(document.getElementById('ed-why').value||'').trim();
    if(!why){document.getElementById('ed-err').textContent='사유를 적어 주세요.';document.getElementById('ed-why').focus();return}
    if(S.editing.mode==='keep')m.decision={kind:'현재대로 유지',action:{type:'keep'},reason:why};
    else{const v=document.getElementById('ed-sel').value;m.decision={kind:'수정',action:v==='next'?{type:'next',conds:m.parsed?m.parsed.conditions:emptyCond()}:{type:'move',k:v},reason:why}}
    log(`${S.round}차 조율`,`${full(C(m.cid))}: 조교 ${m.decision.kind} · 사유 "${why}"`);S.editing=null;
  }
  else if(a==='undo')m.decision=null;
  else if(a==='resolve'){const ms=openMsgs(),done=ms.filter(x=>x.decision).length;
    askConfirm({title:`${S.round}차 재배정을 할까요?`,body:`확인한 처리안 ${done}건만 반영하고 나머지 배정은 그대로 둡니다.${ms.length-done?`\n정하지 않은 ${ms.length-done}건은 ${S.round<3?'다음 차수로 넘어갑니다':'임시 배치로 확정됩니다'}.`:''}`,ok:'재배정'},
      ()=>{resolveRound();S.view=S.stage==='review'?'final':'coord';toast(S.stage==='review'?'조율이 끝났습니다 · 교수님께 확정을 요청하세요':`${S.round}차 조율로 넘어갔습니다`)});return}
  else if(a==='botOpen'){S.botOpen=true;S.ttOpen=false;S.botSeen=true;S.botFocus=true}
  else if(a==='botClose'){S.botOpen=false;render();const f=document.querySelector('.botfab');if(f)f.focus();return}
  else if(a==='botEx'){botRun(t.dataset.v);S.botFocus=true}
  else if(a==='botApply'){const i=+t.dataset.i,p=S.bot.turns[i].preview;
    askConfirm({title:'시간표에 적용할까요?',body:`바뀌는 분반 ${p.changes.length}개 · 하드 규칙 위반 ${p.v}건${p.notice?`\n이미 정해진 강의 ${p.notice}개가 바뀌어 교수님께 변경 안내가 필요합니다.`:''}`,ok:'적용',reason:true,placeholder:'예: 305 공사 일정이 확정됨'},reason=>applyBot(i,reason));return}
  else if(a==='botCancel'){S.bot.turns[+t.dataset.i].preview.state='cancel'}
  else if(a==='csv'){try{exportCsv();toast('CSV 파일을 내려받았습니다')}catch(err){toast('내려받지 못했습니다. 다시 눌러 주세요')}return}
  else if(a==='print'){window.print();return}
  else if(a==='reset'){askConfirm({title:'처음부터 다시 할까요?',body:'시연 상태를 모두 지웁니다.',ok:'다시 시작'},()=>{S=init();sync();toast('처음 상태로 돌렸습니다')});return}
  else if(a==='example'){const f=t.closest('form');f.querySelector('textarea[name=text]').value=SCRIPT[m.round][m.cid];return}
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.botOpen&&S.role==='ta'&&!document.getElementById('dlg').open){S.botOpen=false;render();const f=document.querySelector('.botfab');if(f)f.focus();return}
  if(e.key==='Escape'&&S.ttOpen&&S.role==='ta'&&!document.getElementById('dlg').open&&document.querySelector('.ttpanel')){S.ttOpen=false;render();const f=document.querySelector('.ttfab');if(f)f.focus();return}
  // 칠하기 칸: 화살표로 옮기기 (막힌 칸은 건너뜀)
  const el=e.target.closest&&e.target.closest('.pg .pc');
  const MV={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(!el||!MV||!el.dataset.paint)return;
  e.preventDefault();let d=+el.dataset.d,k=+el.dataset.s;
  for(;;){d+=MV[0];k+=MV[1];if(d<0||d>4||k<0||k>=SLOTS.length)return;
    const n=document.querySelector(`[data-paint="${el.dataset.paint}"][data-d="${d}"][data-s="${k}"]`);if(n&&!n.disabled){n.focus();return}}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.chg;if(!k)return;
  const x=e.target.dataset.c?claimOf(e.target.dataset.c,S.prof):null;
  if(k==='room')S.room=e.target.value;
  if(k==='prof'){S.prof=e.target.value}
  if(k==='fmust'&&x)x.f.must=e.target.checked;
  if(k==='consec'){S.consec[S.prof]=e.target.value;log('희망 수집',`${S.prof} 교수님 연강: ${CONSN[e.target.value]}`)}
  if(k==='flab'&&x)x.f.lab=e.target.value==='1';
  if(k==='fsize'&&x)x.f.size=+e.target.value;
  if(k==='fpref'&&x)x.f.pref=e.target.value||null;
  if(k==='claim'){const cid=e.target.dataset.c;
    if(e.target.checked){if(!claimOf(cid,S.prof))S.claims.push(mkClaim(cid,S.prof,emptyF()))}
    else{S.claims=S.claims.filter(y=>!(y.cid===cid&&y.prof===S.prof));if(S.pick[cid]===S.prof)delete S.pick[cid]}
    sync();log('희망 수집',`${S.prof} 교수님이 ${full(C(cid))}을(를) ${e.target.checked?'골랐습니다':'뺐습니다'}.`)}
  if(k==='reveal'){S.reveal=e.target.checked;log('설정',`상대 교수 이름 알리기: ${S.reveal?'켬':'끔'}`)}
  if(k==='llmFail'){S.llmFail=e.target.checked;reparse();toast(S.llmFail?'언어 모델 실패를 흉내 냅니다 (fallback)':'언어 모델 실패 흉내를 껐습니다')}
  if(k==='autoReply'){S.autoReply=e.target.checked;if(S.autoReply)openMsgs().filter(m=>m.sent&&!m.reply).forEach((m,i)=>later(()=>autoReply(m),i))}
  if(k==='edsel'){const v=e.target.value;if(S.editing)S.editing.sel=v;S.peek=v==='next'?null:{m:e.target.dataset.m,k:v};if(v!=='next'){S.ttOpen=true;S.botOpen=false}render({keep:true});return}
  render();
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.inp;
  if(k==='msgtext'){const m=S.msgs.find(x=>x.id===e.target.dataset.m);if(!m)return;m.text=e.target.value;
    const box=document.querySelector(`[data-probs="${m.id}"]`);if(box)box.innerHTML=probsHTML(m);return}
  if(k!=='fetc')return;const x=claimOf(e.target.dataset.c,S.prof);if(!x)return;
  x.f.etc=e.target.value;x.f.etcOk=false;const sum=document.querySelector(`[data-sum="${x.cid}"]`);if(sum)sum.innerHTML=fChips(x.f,S.prof);
});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.form==='dlg'){
    let reason='';
    if(DLG.reason){reason=(f.querySelector('#dlg-r').value||'').trim();if(!reason){f.querySelector('#dlg-e').textContent='사유를 적어 주세요.';f.querySelector('#dlg-r').focus();return}}
    const cb=DLG.onOk;closeDlg();cb(reason);render();return}
  if(f.dataset.form==='bot'){const v=f.q.value.trim();if(!v){f.q.focus();return}botRun(v);S.botFocus=true}
  if(f.dataset.form==='reply'){const m=S.msgs.find(x=>x.id===f.dataset.m),ch=f.querySelector('input[name=ch]:checked'),txt=f.text.value.trim();
    if(!ch&&!txt){f.text.focus();return}
    receive(m,txt,ch?ch.value:null,`${C(m.cid).prof} 교수님`);log(`${m.round}차 조율`,`${full(C(m.cid))}: ${C(m.cid).prof} 교수님 답장 도착`);toast('답장을 보냈습니다')}
  if(f.dataset.form==='confirm'){const k=S.confirms.find(x=>x.id===f.dataset.k);if(k&&!k.reply){receiveConfirm(k,f.text.value.trim(),`${k.prof} 교수님`);if(S.stage!=='final')toast('확정 회신을 보냈습니다')}}
  render();
});
document.getElementById('dlg').addEventListener('close',()=>{const k=DLG&&DLG.ret;DLG=null;if(k)restoreFocus(k)});
render();
</script>
